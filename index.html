<!DOCTYPE html>
<html lang="en" dir="ltr" data-look="day">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Three Roads</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800;900&family=Nunito:wght@400;600;800;900&family=Overpass:wght@400;600;800;900&family=Overpass+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root {
  /* Layout idea: a night road. Asphalt page, highway-sign panels, one lane-yellow accent.
     Each of the three roads keeps one sign colour from start to finish. */
  --asphalt: #1c2025;
  --asphalt-2: #262b32;
  --asphalt-3: #323942;
  --edge: #414a55;
  --paint: #f4f2ea;
  --muted: #aab2bd;
  --lane: #f5c518;
  --road-1: #1b7a55;
  --road-2: #2362ad;
  --road-3: #8c5a2a;
  --tier-low: #c8684a;
  --tier-mid: #7f9bbd;
  --tier-high: #3dba7c;
  --display: "Overpass", "Highway Gothic", "Arial Narrow", Arial, sans-serif;
  --body: "Overpass", "Segoe UI", Arial, sans-serif;
  --mono: "Overpass Mono", ui-monospace, "SF Mono", Menlo, monospace;
  /* text and details that sit on the accent, tier and road colours */
  --on-accent: var(--asphalt); --on-tier: var(--asphalt); --on-road: var(--paint);
  --eyebrow: var(--lane); --win-off: var(--asphalt); --win-on: var(--lane); --wheel: var(--asphalt); --hair: var(--edge);
  --accent-ink: var(--lane); --sign-line: var(--paint);
  color-scheme: dark;
}
/* Day look: the same road in daylight. Pale sky page, white cards, deep teal accent, three clear road colours. */
:root[data-look="day"] {
  --asphalt: #eef2f7;
  --asphalt-2: #ffffff;
  --asphalt-3: #f3f6fa;
  --edge: #d3dbe7;
  --paint: #162036;
  --muted: #5a6679;
  --lane: #0b7d75;
  --road-1: #2a6fdb;
  --road-2: #7b4fd6;
  --road-3: #cf4129;
  --tier-low: #f0906a;
  --tier-mid: #a9bedb;
  --tier-high: #56c596;
  --on-accent: #ffffff; --on-tier: #162036; --on-road: #ffffff;
  --eyebrow: #0b7d75; --accent-ink: #0b7d75; --sign-line: rgba(255, 255, 255, 0.9);
  --win-off: #b8c6dc; --win-on: #ffc94a; --wheel: #ffffff; --hair: #e4e9f1;
  --display: "Nunito", "Trebuchet MS", "Segoe UI", sans-serif;
  --body: "Nunito", "Trebuchet MS", "Segoe UI", sans-serif;
  color-scheme: light;
}
:root[data-look="day"][lang="ar"] {
  --display: "Cairo", "Noto Kufi Arabic", "Segoe UI", Tahoma, sans-serif;
  --body: "Cairo", "Noto Sans Arabic", "Segoe UI", Tahoma, sans-serif;
}
:root[lang="ar"] {
  --display: "Cairo", "Noto Kufi Arabic", "Segoe UI", Tahoma, sans-serif;
  --body: "Cairo", "Noto Sans Arabic", "Segoe UI", Tahoma, sans-serif;
  --mono: "Overpass Mono", "Cairo", ui-monospace, Menlo, monospace;
}
* { box-sizing: border-box; }
:root[lang="ar"] * { letter-spacing: 0 !important; }
html, body { margin: 0; }
body {
  background: var(--asphalt);
  color: var(--paint);
  font-family: var(--body);
  font-size: 16px;
  line-height: 1.5;
}
:root[lang="ar"] body { line-height: 1.7; }
.wrap { max-width: 1120px; margin: 0 auto; padding: 0 20px 64px; }
h1, h2, h3 { font-family: var(--display); text-wrap: balance; margin: 0; line-height: 1.05; }
:root[lang="ar"] h1, :root[lang="ar"] h2, :root[lang="ar"] h3 { line-height: 1.35; }
h1 { font-weight: 900; font-size: clamp(44px, 9vw, 92px); letter-spacing: -0.02em; text-transform: uppercase; }
h2 { font-weight: 900; font-size: clamp(26px, 4vw, 38px); text-transform: uppercase; letter-spacing: -0.01em; }
h3 { font-weight: 800; font-size: 19px; }
p { margin: 0; }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; font-weight: 700; }
.muted { color: var(--muted); }
.small { font-size: 14px; }
.eyebrow { font-family: var(--display); font-weight: 800; font-size: 13px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--eyebrow); }
:root[lang="ar"] .eyebrow { font-size: 15px; }
a { color: var(--paint); }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--lane); outline-offset: 3px; }

/* top bar */
.top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 24px; padding: 18px 0 14px; }
.brand { font-family: var(--display); font-weight: 900; font-size: 18px; letter-spacing: 0.08em; text-transform: uppercase; }
.top-right { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; }
.steps { display: flex; flex-wrap: wrap; gap: 6px; list-style: none; margin: 0; padding: 0; font-family: var(--display); font-weight: 800; font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; }
:root[lang="ar"] .steps { font-size: 13px; }
.steps li { padding: 5px 10px 3px; border: 2px solid var(--edge); border-radius: 6px; color: var(--muted); }
.steps li.done { border-color: var(--muted); color: var(--paint); }
.steps li.now { background: var(--lane); border-color: var(--lane); color: var(--on-accent); }
.lang { padding: 5px 12px 3px; border: 2px solid var(--paint); border-radius: 6px; background: transparent; font-weight: 800; font-size: 13px; font-family: "Cairo", "Overpass", sans-serif; }
.lang:hover { background: var(--asphalt-3); }
.dash { height: 5px; background: repeating-linear-gradient(90deg, var(--lane) 0 34px, transparent 34px 62px); border-radius: 2px; }

/* birth strip */
.strip { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; margin-top: 18px; padding: 10px 14px; background: var(--asphalt-2); border: 1px solid var(--edge); border-radius: 10px; font-size: 15px; }
.code { display: inline-block; min-width: 38px; padding: 4px 7px 2px; text-align: center; font-family: "Overpass", Arial, sans-serif; font-weight: 900; font-size: 14px; letter-spacing: 0.04em; background: var(--paint); color: var(--asphalt); border-radius: 5px 5px 11px 11px; line-height: 1.5; }

/* stage */
.stage { display: grid; gap: 28px; margin-top: 36px; }
.lede { font-size: clamp(18px, 2.4vw, 23px); max-width: 34em; line-height: 1.4; }
:root[lang="ar"] .lede { line-height: 1.7; }
.hero { display: grid; gap: 18px; }
.cols { display: grid; gap: 28px; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); align-items: start; }
.cols.wide { grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); }
@media (max-width: 820px) { .cols, .cols.wide { grid-template-columns: 1fr; } }
.stack { display: grid; gap: 16px; }

/* highway sign */
.sign { --c: var(--road-1); background: var(--c); color: var(--on-road); border: 5px solid var(--c); box-shadow: inset 0 0 0 3px var(--sign-line); border-radius: 16px; padding: 26px 26px 24px; display: grid; gap: 10px; }
.sign .label { font-family: var(--display); font-weight: 800; font-size: 13px; letter-spacing: 0.16em; text-transform: uppercase; }
:root[lang="ar"] .sign .label { font-size: 15px; }
.sign .place { font-family: var(--display); font-weight: 900; font-size: clamp(34px, 6vw, 58px); line-height: 1; text-transform: uppercase; letter-spacing: -0.01em; min-height: 1em; overflow-wrap: anywhere; }
:root[lang="ar"] .sign .place { line-height: 1.3; }
.sign .facts { display: grid; gap: 4px; font-size: 16px; }
.sign .facts .num { font-size: 20px; }

.btn { display: inline-flex; align-items: center; justify-content: center; padding: 14px 22px 11px; border-radius: 10px; border: 2px solid var(--paint); background: transparent; font-family: var(--display); font-weight: 900; font-size: 16px; letter-spacing: 0.06em; text-transform: uppercase; }
:root[lang="ar"] .btn { padding: 10px 22px; font-size: 17px; }
.btn.go { background: var(--lane); border-color: var(--lane); color: var(--on-accent); }
.btn:hover:not(:disabled) { transform: translateY(-1px); }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }
.actions { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }

.chips { display: grid; grid-template-columns: repeat(auto-fill, minmax(215px, 1fr)); gap: 8px; list-style: none; margin: 0; padding: 0; }
.chips li { display: flex; align-items: center; gap: 10px; padding: 8px 10px; background: var(--asphalt-2); border: 1px solid var(--edge); border-radius: 8px; font-size: 15px; }
.chips li .num { margin-inline-start: auto; font-size: 13px; color: var(--muted); }
.chips li.hit { border-color: var(--lane); box-shadow: inset 0 0 0 1px var(--lane); }
.chips li.hit .num { color: var(--paint); }
.chips li.flick { background: var(--asphalt-3); }

.rules { display: grid; gap: 10px; margin: 0; padding: 0; list-style: none; counter-reset: r; }
.rules li { counter-increment: r; display: grid; grid-template-columns: 34px 1fr; gap: 12px; align-items: start; }
.rules li::before { content: counter(r); font-family: "Overpass", Arial, sans-serif; font-weight: 900; background: var(--paint); color: var(--asphalt); border-radius: 5px 5px 11px 11px; text-align: center; padding: 5px 0 2px; line-height: 1.5; }

/* majors */
.grid-majors { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
.major { position: relative; text-align: start; display: grid; gap: 8px; align-content: start; padding: 16px 16px 14px; background: var(--asphalt-2); border: 2px solid var(--edge); border-radius: 12px; }
.major:hover { border-color: var(--muted); }
.major[aria-pressed="true"] { background: var(--c); border-color: var(--paint); color: var(--on-road); }
.major[aria-pressed="true"] .muted { color: var(--on-road); }
.major .pick { position: absolute; top: 12px; inset-inline-end: 12px; font-family: var(--display); font-weight: 900; font-size: 13px; letter-spacing: 0.06em; background: var(--paint); color: var(--asphalt); padding: 4px 8px 2px; border-radius: 5px 5px 11px 11px; }
:root[lang="ar"] .major .pick { padding: 1px 8px; }
.major h3 { padding-inline-end: 92px; }
.major ul { margin: 0; padding: 0; list-style: none; font-size: 14px; color: var(--muted); }
.major[aria-pressed="true"] ul { color: var(--on-road); }

.odds-table { display: grid; gap: 10px; }
.odds-row { display: grid; grid-template-columns: 96px 1fr; gap: 12px; align-items: center; font-size: 14px; }
.bar { display: flex; direction: ltr; height: 26px; border-radius: 6px; overflow: hidden; font-family: var(--mono); font-weight: 700; font-size: 12px; color: var(--on-tier); }
.bar span { display: flex; align-items: center; justify-content: center; white-space: nowrap; overflow: hidden; }
.bar .low { background: var(--tier-low); }
.bar .mid { background: var(--tier-mid); }
.bar .high { background: var(--tier-high); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-inline-end: 6px; }

/* roads */
.roads { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; align-items: start; }
@media (max-width: 900px) { .roads { grid-template-columns: 1fr; } }
.road { display: grid; gap: 10px; }
.road-head { --c: var(--road-1); background: var(--c); color: var(--on-road); border-radius: 12px; padding: 14px 16px 12px; display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; align-items: center; box-shadow: inset 0 0 0 2px var(--sign-line); }
.road-head .code { grid-row: span 2; font-size: 18px; min-width: 44px; padding: 7px 8px 4px; }
.road-head .who { font-family: var(--display); font-weight: 900; font-size: 18px; text-transform: uppercase; line-height: 1.1; }
:root[lang="ar"] .road-head .who { line-height: 1.4; }
.road-head .sub { font-size: 13px; }
.r1 { --c: var(--road-1); } .r2 { --c: var(--road-2); } .r3 { --c: var(--road-3); }

.spec { text-align: start; display: grid; gap: 8px; padding: 12px 14px; background: var(--asphalt-2); border: 2px solid var(--edge); border-radius: 10px; width: 100%; }
.spec:hover { border-color: var(--muted); }
.spec[aria-pressed="true"] { border-color: var(--lane); box-shadow: inset 0 0 0 1px var(--lane); background: var(--asphalt-3); }
.spec h3 { font-size: 17px; }
.jobs { display: grid; gap: 3px; font-size: 14px; }
.jobs div { display: grid; grid-template-columns: 12px 1fr auto; gap: 8px; align-items: baseline; }
.dot { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
.dot.low { background: var(--tier-low); } .dot.mid { background: var(--tier-mid); } .dot.high { background: var(--tier-high); }
.spec .model { font-size: 13px; line-height: 1.45; border-top: 1px solid var(--edge); padding-top: 6px; display: grid; gap: 4px; }
:root[lang="ar"] .spec .model { line-height: 1.7; }
.spec .model .k { font-family: var(--display); font-weight: 800; font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent-ink); }
:root[lang="ar"] .spec .model .k { font-size: 13px; }
.spec .model .muted { color: var(--muted); }
.spec .exp { font-size: 13px; color: var(--muted); border-top: 1px solid var(--edge); padding-top: 6px; display: flex; justify-content: space-between; gap: 8px; }

/* job draw */
.draw { display: grid; gap: 14px; padding: 16px; background: var(--asphalt-2); border: 1px solid var(--edge); border-radius: 12px; }
.track { position: relative; direction: ltr; padding: 16px 0 6px; }
.track .bar { height: 34px; font-size: 13px; font-family: var(--body); }
.marker { position: absolute; top: 4px; bottom: 0; width: 0; left: 0; }
.marker::before { content: ""; position: absolute; left: -3px; top: 6px; bottom: 0; width: 6px; background: var(--paint); border-radius: 3px; box-shadow: 0 0 0 2px var(--asphalt); }
.marker::after { content: ""; position: absolute; left: -8px; top: -4px; border: 8px solid transparent; border-top-color: var(--lane); }
.draw .outcome { display: grid; gap: 2px; min-height: 3.2em; }
.draw .outcome .job { font-family: var(--display); font-weight: 900; font-size: 20px; text-transform: uppercase; line-height: 1.1; }
:root[lang="ar"] .draw .outcome .job { line-height: 1.5; }
.pill { display: inline-block; padding: 3px 9px 1px; border-radius: 99px; font-family: var(--display); font-weight: 900; font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--on-tier); }
:root[lang="ar"] .pill { padding: 0 10px; font-size: 13px; }
.pill.low { background: var(--tier-low); } .pill.mid { background: var(--tier-mid); } .pill.high { background: var(--tier-high); }
.pill.plain { background: var(--paint); color: var(--asphalt); }

/* three lives */
.lives { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0 16px; }
.life { display: grid; grid-template-rows: subgrid; grid-row: span 10; background: var(--asphalt-2); border: 1px solid var(--edge); border-radius: 14px; overflow: hidden; }
.life.best { border-color: var(--lane); box-shadow: 0 0 0 1px var(--lane); }
.life .road-head { border-radius: 0; box-shadow: none; border-bottom: 3px solid var(--paint); }
.cell { padding: 12px 16px; border-bottom: 1px solid var(--hair); display: grid; gap: 3px; align-content: start; }
.cell:last-child { border-bottom: 0; }
.cell .k { font-family: var(--display); font-weight: 800; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
:root[lang="ar"] .cell .k { font-size: 13px; }
.cell .v { font-weight: 600; font-size: 16px; line-height: 1.3; }
:root[lang="ar"] .cell .v { line-height: 1.6; }
.cell .v.big { font-family: var(--mono); font-weight: 700; font-size: 23px; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.cell .n { font-size: 13px; color: var(--muted); }
.ranks { display: grid; gap: 4px; font-size: 14px; align-content: start; }
.ranks div { display: grid; grid-template-columns: 14px 1fr 36px auto; gap: 8px; align-items: baseline; }
.ranks div .num:first-child { color: var(--accent-ink); }
.ranks div.top { font-weight: 800; }
.ranks .num { font-size: 13px; }
@media (max-width: 900px) { .lives { grid-template-columns: 1fr; gap: 16px; } .life { grid-template-rows: none; grid-row: auto; } }

.panel { background: var(--asphalt-2); border: 1px solid var(--edge); border-radius: 14px; padding: 20px; display: grid; gap: 14px; }
.else { display: grid; gap: 5px; }
.else .row { display: grid; grid-template-columns: 128px 1fr 84px; gap: 10px; align-items: center; font-size: 14px; }
.else .row .b { height: 14px; background: var(--asphalt-3); border-radius: 3px; }
.else .row .b i { display: block; height: 100%; background: var(--muted); border-radius: 3px; min-width: 2px; }
.else .row.me { font-weight: 800; }
.else .row.me .b i { background: var(--lane); }
.else .row .num { text-align: end; }
@media (max-width: 480px) { .else .row { grid-template-columns: 104px 1fr 72px; } }

.events { display: grid; gap: 0; font-size: 14px; }
.events .ev { display: grid; grid-template-columns: 92px 1fr auto; gap: 12px; align-items: center; padding: 7px 0; border-top: 1px solid var(--edge); }
.events .ev:first-child { border-top: 0; }
.events .ev .eff { font-family: var(--mono); font-weight: 700; direction: ltr; }
.events .ev .who { display: inline-flex; gap: 4px; margin-inline-start: 8px; vertical-align: middle; }
.events .ev .who .code { min-width: 26px; font-size: 12px; padding: 2px 5px 0; background: var(--lane); }
.events .ev.hit { color: var(--paint); font-weight: 800; }
.events .ev:not(.hit).dim { color: var(--muted); }

.sources { border-top: 1px solid var(--edge); margin-top: 56px; padding-top: 24px; display: grid; gap: 12px; font-size: 14px; color: var(--muted); max-width: 74ch; }
.sources .src-lead { color: var(--paint); font-size: 15px; }
.sources summary { cursor: pointer; font-family: var(--display); font-weight: 800; color: var(--paint); padding: 6px 0; }
.sources details[open] summary { margin-bottom: 8px; }
.sources ul { margin: 0; padding-inline-start: 18px; display: grid; gap: 6px; }

/* talents, tags, life choices, verdict */
.talents { display: inline-flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.talent { display: inline-block; padding: 2px 10px 0; border-radius: 99px; background: var(--lane); color: var(--on-accent); font-family: var(--display); font-weight: 800; font-size: 13px; }
.talent-row { display: grid; grid-template-columns: 96px 1fr; gap: 12px; align-items: baseline; }
.talent-row .talent { text-align: center; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tag { font-size: 12px; font-weight: 600; padding: 2px 8px 0; border-radius: 5px; background: rgba(0, 0, 0, 0.28); border: 1px solid var(--edge); color: var(--paint); }
.tag.diff-a { border-color: var(--tier-low); } .tag.diff-b { border-color: var(--tier-mid); } .tag.diff-c { border-color: var(--tier-high); }
.tag.hit { background: var(--lane); color: var(--on-accent); border-color: var(--lane); font-weight: 800; }
ol.plain { margin: 0; padding-inline-start: 18px; display: grid; gap: 4px; }
.mini { display: grid; gap: 4px; }
.mini .bar { height: 18px; font-size: 11px; }
.mini .k, .reveal .k { font-family: var(--display); font-weight: 800; font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
:root[lang="ar"] .mini .k, :root[lang="ar"] .reveal .k { font-size: 13px; }
.choice { text-align: start; display: grid; gap: 4px; padding: 12px 14px; width: 100%; background: var(--asphalt-3); border: 2px solid var(--edge); border-radius: 10px; }
.choice:hover { border-color: var(--paint); }
.choice.risk { border-color: var(--lane); }
.choice strong { font-family: var(--display); font-weight: 900; font-size: 16px; text-transform: uppercase; }
.result { display: grid; gap: 6px; }
.status { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; justify-content: space-between; }
.track.small { padding: 12px 0 2px; }
.track.small .bar { height: 20px; font-size: 12px; }
.reveal { display: grid; gap: 4px; border-top: 1px solid var(--edge); padding-top: 10px; }
.reveal .v { font-weight: 600; }
.ranks div.got { color: var(--accent-ink); }
.choices { display: grid; gap: 4px; font-size: 14px; }
.choices div { display: grid; grid-template-columns: 24px 1fr auto; gap: 8px; align-items: center; }
.cell .v.score { font-family: var(--mono); font-weight: 700; font-size: 34px; color: var(--accent-ink); line-height: 1.1; }
.stack.tight { gap: 6px; }
.verdict { max-width: 640px; gap: 14px; }
.verdict-main { display: flex; flex-wrap: wrap; gap: 14px 28px; align-items: center; }
.card-top { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 16px; }
.card-life { display: grid; grid-template-columns: 96px 96px 1fr; gap: 10px; align-items: center; }
.card-life .pic { width: auto; max-width: none; background: var(--asphalt-2); border-radius: 10px; padding: 6px 8px; }
@media (max-width: 480px) { .card-life { grid-template-columns: 1fr 1fr; } .card-life .stack { grid-column: 1 / -1; } }
.bigscore { display: grid; justify-items: center; line-height: 1; gap: 4px; }
.bigscore .num { font-size: clamp(64px, 12vw, 104px); }
.verdict .place { font-size: clamp(26px, 4.5vw, 42px); }
.verdict .btn.go { border-color: var(--lane); }
.sharebox { width: 100%; font: inherit; font-size: 14px; padding: 10px; border-radius: 8px; border: 1px solid var(--paint); background: var(--asphalt); color: var(--paint); }

.pager { display: none; }
@media (max-width: 700px) {
  /* compact progress: only the current step keeps its name */
  .steps { flex-wrap: nowrap; }
  .steps li:not(.now) .lbl { display: none; }
  .stage { gap: 20px; margin-top: 24px; }
  /* the three roads become cards you swipe between */
  .roads, .lives { display: flex; gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory; margin-inline: -20px; padding: 4px 20px 14px; scrollbar-width: none; }
  .roads::-webkit-scrollbar, .lives::-webkit-scrollbar { display: none; }
  .roads > *, .lives > * { flex: 0 0 86%; scroll-snap-align: center; }
  .pager { display: flex; gap: 8px; align-items: center; }
  .pager button { display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 4px 14px 2px; border-radius: 99px; border: 2px solid var(--c); background: var(--c); color: var(--on-road); font-family: var(--display); font-weight: 900; }
  .pager button.todo { background: transparent; color: var(--paint); }
  /* the main button stays within thumb reach */
  .actions.main { position: sticky; bottom: 0; z-index: 5; margin-inline: -20px; padding: 10px 20px; background: var(--asphalt); border-top: 1px solid var(--edge); }
  .actions.main .btn { flex: 1 1 auto; }
}
.art { display: block; width: 100%; height: auto; }
.pic { width: 124px; max-width: 70%; }
.lanes { direction: ltr; display: grid; gap: 6px; }
.lanes .ages { position: relative; height: 18px; font-family: var(--mono); font-weight: 700; font-size: 12px; color: var(--muted); }
.lanes .ages span { position: absolute; transform: translateX(-50%); }
.lane { position: relative; height: 44px; border-radius: 8px; background: var(--asphalt-2); border: 1px solid var(--edge); overflow: hidden; }
.lane::before { content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 3px; margin-top: -1.5px; background: repeating-linear-gradient(90deg, var(--c) 0 22px, transparent 22px 40px); }
.lane .tick { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--hair); }
.lane .veh { position: absolute; bottom: 1px; width: 78px; transform: translateX(-50%); }
.codeform { display: grid; gap: 8px; }
.codeform input { font-family: var(--mono); font-weight: 700; font-size: 16px; letter-spacing: 0.06em; text-transform: uppercase; padding: 12px 14px 10px; width: 190px; max-width: 100%; border-radius: 10px; border: 2px solid var(--edge); background: var(--asphalt-2); color: var(--paint); }
.codeform input::placeholder { color: var(--muted); opacity: 0.7; }
.codeval { font-size: 22px; letter-spacing: 0.06em; }
.warn { color: var(--tier-low); font-weight: 600; }
.btn.slim { padding: 8px 14px 6px; font-size: 13px; }
:root[lang="ar"] .btn.slim { padding: 5px 14px; font-size: 14px; }

#oops { background: #b3261e; color: #fff; padding: 12px 20px; font-weight: 600; }
.confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; }

/* day look: soft cards, no hard outlines */
[data-look="day"] .dash { background: repeating-linear-gradient(90deg, var(--road-1) 0 34px, transparent 34px 48px, var(--road-2) 48px 82px, transparent 82px 96px, var(--road-3) 96px 130px, transparent 130px 144px); }
[data-look="day"] :is(.panel, .major, .spec, .draw, .life, .strip, .choice) { box-shadow: 0 1px 2px rgba(22, 32, 54, 0.05), 0 6px 20px rgba(22, 32, 54, 0.06); }
[data-look="day"] .sign { box-shadow: inset 0 0 0 3px var(--sign-line), 0 10px 28px rgba(22, 32, 54, 0.16); }
[data-look="day"] .btn { background: #fff; border-color: #b9c4d6; }
[data-look="day"] .btn.go { background: var(--lane); border-color: var(--lane); }
[data-look="day"] .lang { background: #fff; border-color: #b9c4d6; font-family: var(--display); }
[data-look="day"] .steps li:not(.now) { background: #fff; }
[data-look="day"] .tag { background: var(--asphalt-3); }
[data-look="day"] .tag.hit { background: var(--lane); }
[data-look="day"] :is(.road-head, .major[aria-pressed="true"]) :is(.code, .pick) { background: #fff; color: var(--paint); }
[data-look="day"] .life .road-head { border-bottom: 0; }
[data-look="day"] .life.best { box-shadow: 0 0 0 2px var(--lane), 0 10px 28px rgba(11, 125, 117, 0.18); }
[data-look="day"] .chips li.flick { background: #dfe7f3; }
[data-look="day"] :is(.codeform input, .sharebox) { background: #fff; }
[data-look="day"] .warn { color: #b3261e; }
[data-look="day"] .verdict .btn.go { border-color: var(--lane); }

@media (prefers-reduced-motion: no-preference) {
  [data-look="day"] :is(.major, .spec, .choice) { transition: transform 0.12s, box-shadow 0.12s; }
  [data-look="day"] :is(.major, .spec, .choice):hover { transform: translateY(-2px); }
  .stage > * { animation: rise 0.35s ease-out both; }
  @keyframes rise { from { transform: translateY(8px); opacity: 0.4; } to { transform: none; opacity: 1; } }
  .btn { transition: transform 0.12s; }
}

/* ===== v11: movement, hidden explanations, wheel, reels, body figure ===== */
:root {
  --w1: #1b7a55; --w2: #2362ad; --w3: #8c5a2a; --w4: #a8456b; --w5: #566575; --w6: #9a7a10;
  --wheel-rim: var(--paint); --pop-bg: #f4f2ea; --pop-ink: #1c2025; --good: var(--tier-high); --bad: var(--tier-low);
}
:root[data-look="day"] {
  --w1: #2a6fdb; --w2: #7b4fd6; --w3: #cf4129; --w4: #0b7d75; --w5: #b3780a; --w6: #44597a;
  --wheel-rim: #162036; --pop-bg: #162036; --pop-ink: #ffffff; --good: #17734a; --bad: #b3261e;
}
h2 .tip-b { vertical-align: 0.2em; }

/* explanations: hidden until hover (computer) or tap (phone) */
.tip-b { position: relative; display: inline-grid; place-items: center; flex: none; width: 22px; height: 22px; padding: 0; border-radius: 50%;
  border: 1.5px solid currentColor; background: transparent; color: inherit; opacity: 0.65; cursor: help;
  font: italic 800 13px/1 Georgia, "Times New Roman", serif; letter-spacing: 0; text-transform: none; vertical-align: middle; }
.tip-b::after { content: ""; position: absolute; inset: -10px; }
.tip-b:hover, .tip-b:focus-visible, .tip-b[aria-expanded="true"] { opacity: 1; }
.tip-w { cursor: help; text-decoration: underline dotted; text-decoration-thickness: 1.5px; text-underline-offset: 3px; text-decoration-color: var(--muted); }
.tag.tip-w { text-decoration: none; }
.pop { position: fixed; z-index: 30; left: 0; top: 0; display: grid; gap: 8px; max-width: min(340px, calc(100vw - 16px)); padding: 12px 14px;
  border-radius: 12px; background: var(--pop-bg); color: var(--pop-ink); font-size: 14px; line-height: 1.45; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3); }
:root[lang="ar"] .pop { line-height: 1.7; }
.pop[hidden] { display: none; }
.pop p { margin: 0; }
.pop ul, .pop ol.plain { margin: 0; padding-inline-start: 18px; display: grid; gap: 3px; }
.pop .k { font-family: var(--display); font-weight: 800; font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; opacity: 0.75; }
.pop .rules { font-size: 14px; }
.pop .rules li::before { background: var(--pop-ink); color: var(--pop-bg); }
.pop .legend { color: inherit; opacity: 0.85; }
.pop .odds-row { grid-template-columns: 84px 1fr; font-size: 13px; }
select.lang { appearance: auto; -webkit-appearance: menulist; padding-inline: 8px; max-width: 150px; }
.lang.help { width: 34px; padding-inline: 0; border-radius: 50%; font-weight: 900; cursor: help; }

/* birth: the wheel */
.birth { display: grid; grid-template-columns: minmax(240px, 380px) minmax(0, 1fr); gap: 36px; align-items: center; }
@media (max-width: 820px) { .birth { grid-template-columns: 1fr; gap: 22px; } .wheel-wrap { max-width: 300px; margin-inline: auto; } }
.birth { overflow-x: clip; overflow-clip-margin: 0; padding-block: 12px 40px; margin-block: -12px -40px; }
.wheel-wrap { position: relative; width: 100%; aspect-ratio: 1; direction: ltr; }
.wheel-disc { width: 100%; height: 100%; border-radius: 50%; will-change: transform; box-shadow: 0 14px 36px rgba(22, 32, 54, 0.25); }
.wheel-disc svg { display: block; width: 100%; height: 100%; }
.wheel-disc text { font-family: "Overpass", "Nunito", Arial, sans-serif; font-weight: 900; font-size: 13px; fill: #fff; }
.wheel-disc path { stroke: rgba(255, 255, 255, 0.55); stroke-width: 1; }
.wheel-pin { position: absolute; top: -8px; left: 50%; margin-left: -13px; width: 0; height: 0; border: 13px solid transparent; border-top: 26px solid var(--wheel-rim);
  filter: drop-shadow(0 2px 2px rgba(0, 0, 0, 0.3)); }
.wheel-hub { position: absolute; top: 50%; left: 50%; width: 30%; aspect-ratio: 1; transform: translate(-50%, -50%); display: grid; place-items: center; border-radius: 50%;
  background: var(--asphalt-2); border: 4px solid var(--wheel-rim); color: var(--paint); font-family: "Overpass", "Nunito", Arial, sans-serif; font-weight: 900; font-size: clamp(20px, 4vw, 30px); }
.wheel-hub.got { background: var(--lane); color: var(--on-accent); }
.sign .label { display: flex; align-items: center; gap: 8px; }
.btn.big { font-size: 19px; padding: 18px 30px 15px; }
:root[lang="ar"] .btn.big { padding: 13px 30px; font-size: 20px; }
.tal-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.tal-card { perspective: 700px; }
.tal-in { position: relative; display: grid; min-height: 86px; transform-style: preserve-3d; }
.tal-face { grid-area: 1 / 1; display: grid; gap: 2px; align-content: center; padding: 12px 14px; border-radius: 12px; background: var(--asphalt-2); border: 2px solid var(--lane);
  backface-visibility: hidden; -webkit-backface-visibility: hidden; }
.tal-front strong { font-family: var(--display); font-weight: 900; font-size: 21px; }
.tal-front .tip-b { position: absolute; top: 10px; inset-inline-end: 10px; }
.tal-back { transform: rotateY(180deg); justify-items: center; background: var(--lane); color: var(--on-accent); font-family: var(--display); font-weight: 900; font-size: 36px; }
.codebar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.codebox summary { cursor: pointer; font-weight: 700; color: var(--muted); padding: 4px 0; }
.codebox[open] summary { margin-bottom: 8px; }

/* talents: the player picks two of six */
.tal-head { display: flex; align-items: center; gap: 8px; }
.tal-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 520px) { .tal-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.tal-pick { position: relative; display: grid; gap: 2px; padding: 12px 14px; padding-inline-end: 40px; border-radius: 12px; background: var(--asphalt-2);
  border: 2px solid var(--edge); cursor: pointer; -webkit-tap-highlight-color: transparent; transition: transform 0.15s, border-color 0.15s, background 0.15s; }
.tal-pick strong { font-family: var(--display); font-weight: 900; font-size: 19px; }
.tal-pick .small { color: var(--muted); }
.tal-pick .tip-b { position: absolute; top: 10px; inset-inline-end: 10px; }
.tal-pick:hover { border-color: var(--lane); }
.tal-pick:active { transform: scale(0.97); }
.tal-pick:focus-visible { outline: 3px solid var(--lane); outline-offset: 2px; }
.tal-pick.on { background: var(--lane); border-color: var(--lane); color: var(--on-accent); }
.tal-pick.on .small { color: inherit; opacity: 0.85; }
.tal-pick.off { opacity: 0.5; }
.major.fit1, .major.fit2 { border-inline-start: 6px solid var(--lane); }
.v.mate { font-family: var(--display); font-weight: 900; font-size: 19px; line-height: 1.2; }

/* majors: cards and the tray of three road slots */
.major, .spec { cursor: pointer; -webkit-tap-highlight-color: transparent; }
.major h3 { padding-inline-end: 40px; }
.major .pick { min-width: 30px; text-align: center; font-size: 15px; }
.major .tags { align-items: center; }
.major .tags .tip-b { margin-inline-start: auto; }
.tray { position: sticky; bottom: 0; z-index: 5; margin-inline: -20px; padding: 10px 20px; background: var(--asphalt); border-top: 1px solid var(--edge); }
.slots { display: flex; gap: 8px; flex: 1 1 340px; min-width: 0; }
.slot { flex: 1 1 0; min-width: 0; min-height: 44px; display: flex; align-items: center; gap: 8px; padding: 5px 10px; border-radius: 10px; border: 2px dashed var(--c);
  background: transparent; color: var(--muted); font-family: var(--body); font-weight: 700; font-size: 14px; text-align: start; }
.slot .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.slot .code { min-width: 26px; font-size: 13px; background: var(--c); color: var(--on-road); }
.slot.full { border-style: solid; background: var(--c); color: var(--on-road); }
.slot.full .code { background: var(--paint); color: var(--asphalt); }
[data-look="day"] .slot.full .code { background: #fff; color: var(--paint); }
.slot .x { font-size: 18px; line-height: 1; opacity: 0.85; }
@media (max-width: 560px) { .slot .nm { display: none; } .slot { flex: 0 0 auto; } .slot.full .x { display: none; } .slots { flex: 0 0 auto; } }

/* focus cards */
.mini .k, .cell .k { display: flex; align-items: center; gap: 6px; }
.cell .k { justify-content: space-between; }
.spec .model .names { display: flex; flex-wrap: wrap; gap: 4px 12px; font-weight: 700; }

/* first job: reels */
.reels { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; align-items: start; }
@media (max-width: 900px) { .reels { grid-template-columns: 1fr; gap: 12px; } }
.reel { --row: 44px; position: relative; height: calc(var(--row) * 3); overflow: hidden; border-radius: 12px; background: var(--asphalt-3); border: 2px solid var(--edge); }
.reel::after { content: ""; position: absolute; left: 0; right: 0; top: var(--row); height: var(--row); border-block: 3px solid var(--c); pointer-events: none; }
.reel-strip { will-change: transform; }
.reel-row { height: var(--row); display: flex; align-items: center; gap: 10px; padding-inline: 14px; font-weight: 700; font-size: 15px; white-space: nowrap; overflow: hidden; }
.reel-row span:last-child { overflow: hidden; text-overflow: ellipsis; }
.reel-card .outcome { min-height: 3.6em; }
.reel-card.done .reel { border-color: var(--c); }
.skip-hint { display: none; }
body.show-on .skip-hint { display: inline; }
@media (max-width: 700px) { .reel { --row: 36px; } .reel-card { padding: 12px; gap: 10px; } }

/* life choices */
.story { display: grid; gap: 6px; }
.story h3 { font-size: 18px; line-height: 1.2; }
.story p { font-size: 14.5px; color: var(--muted); }
.bar.chance { height: 16px; font-size: 11px; }
.fx { display: grid; gap: 2px; font-size: 13.5px; font-weight: 600; }
.fx .up { color: var(--good); }
.fx .down { color: var(--bad); }
.draw.wait .late { visibility: hidden; }
.reveal .pic, .card-life .pic { overflow: hidden; }

/* result card and the body figure */
.roast { font-weight: 800; font-style: italic; font-size: clamp(17px, 2.4vw, 21px); line-height: 1.3; }
:root[lang="ar"] .roast { font-style: normal; line-height: 1.6; }
.card-life { grid-template-columns: 96px 96px 78px 1fr; }
@media (max-width: 480px) { .card-life { grid-template-columns: 1fr 1fr 78px; } .card-life .stack { grid-column: 1 / -1; } }
.pic.fig { display: grid; place-items: center; color: var(--paint); }
.weight { display: inline-flex; align-items: flex-end; gap: 5px; cursor: help; color: var(--paint); border-radius: 8px; }
.weight .body { width: 30px; }
.weight .num { font-size: 15px; }
.with-body { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: end; }
.panel > .eyebrow { display: flex; align-items: center; gap: 8px; }
:root { --heart: #e25563; --coin: #e8b93b; --coin-edge: #94700c; }
.with-ico { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: center; }
.art.ico { width: 44px; height: auto; flex: none; }

/* movement */
.btn:active:not(:disabled) { transform: translateY(1px) scale(0.98); }
@media (prefers-reduced-motion: no-preference) {
  .stage:not(.enter) > * { animation: none; }
  .stage.enter :is(.major, .spec, .life, .reel-card) { animation: rise 0.45s ease-out both; animation-delay: calc(var(--i, 0) * 45ms + 60ms); }
  .btn.big { animation: pulse 1.9s ease-in-out infinite; }
  @keyframes pulse { 50% { box-shadow: 0 0 0 10px color-mix(in srgb, var(--lane) 22%, transparent); } }
  .sign.land { animation: land 0.5s cubic-bezier(0.2, 0.8, 0.2, 1) both; }
  @keyframes land { from { transform: scale(0.9); opacity: 0.2; } }
  .tal-card.flip .tal-in { animation: flip 0.7s cubic-bezier(0.3, 0.7, 0.2, 1) both; animation-delay: calc(0.3s + var(--i, 0) * 0.35s); }
  @keyframes flip { from { transform: rotateY(180deg); } to { transform: none; } }
  .tal-grid.deal .tal-pick { animation: rise 0.4s ease-out both; animation-delay: calc(0.25s + var(--i, 0) * 70ms); }
  .reel-card.done .outcome { animation: rise 0.35s ease-out both; }
  .lanes.drive .veh { animation: laneIn 0.9s cubic-bezier(0.3, 0.7, 0.2, 1) both; }
  @keyframes laneIn { from { left: var(--from); } }
  .draw.fresh .late { animation: rise 0.4s ease-out both; }
  .draw.fresh .pic.car svg { animation: driveIn 0.7s 0.1s cubic-bezier(0.2, 0.8, 0.2, 1) both; }
  .draw.fresh .pic.home svg { animation: build 0.7s 0.1s ease-out both; }
  @keyframes driveIn { from { transform: translateX(-130%); } }
  @keyframes build { from { clip-path: inset(100% 0 0 0); transform: translateY(6px); } to { clip-path: inset(0); transform: none; } }
  .verdict.show .stamp { animation: stamp 0.5s 1s both; }
  @keyframes stamp { from { transform: scale(2.2) rotate(-7deg); opacity: 0; } 60% { transform: scale(0.96) rotate(1deg); opacity: 1; } to { transform: none; } }
  .verdict.show .roast { animation: rise 0.5s 1.5s both; }
  .verdict.show .pic.car svg { animation: driveIn 0.8s 0.3s cubic-bezier(0.2, 0.8, 0.2, 1) both; }
  .verdict.show .pic.home svg { animation: build 0.8s 0.6s ease-out both; }
  .verdict.show .pic.fig { animation: rise 0.5s 0.9s both; }
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand" id="brand">Three Roads</div>
    <div class="top-right">
      <ol class="steps" id="steps" aria-label="Progress"></ol>
      <button class="lang help" id="help" data-tip="help" aria-label="?">?</button>
      <button class="lang" id="look" data-act="look">Night look</button>
      <select class="lang" id="lang" aria-label="Language"><option value="en">English</option><option value="es">Español</option><option value="pt">Português</option><option value="fr">Français</option><option value="it">Italiano</option><option value="ar">العربية</option><option value="pcm">Naijá (Pidgin)</option></select>
    </div>
  </header>
  <div class="dash" aria-hidden="true"></div>
  <div id="strip"></div>
  <main class="stage" id="stage"></main>
  <footer class="sources" id="sources"></footer>
</div>
<div id="pop" class="pop" role="tooltip" hidden></div>

<script>
// If anything fails, say so on the page.
function showProblem(msg) {
  var el = document.getElementById('oops');
  if (!el) { el = document.createElement('div'); el.id = 'oops'; el.setAttribute('role', 'alert'); document.body.insertBefore(el, document.body.firstChild); }
  el.textContent = 'Something went wrong. Please send this line to whoever shared the game: ' + msg;
}
window.addEventListener('error', function (e) { showProblem(e.message || 'unknown error'); });
window.addEventListener('unhandledrejection', function (e) { showProblem(String((e.reason && e.reason.message) || e.reason)); });
</script>
<script>
/* ===== DATA ===== */
// Names are [English, Arabic].
// local, usd: gross average wage 2024 in national currency and in USD at market rates
//   (OECD Pensions at a Glance 2025, table 7.5; Egypt: CAPMAS average weekly wage, Dec 2024, via wage.is).
// g: graduate earnings premium relative to the US (OECD Education at a Glance 2026, table A4.1; US = 170, upper secondary = 100).
// d: doctor pay relative to the US level (OECD Health at a Glance 2025: salaried specialists average 2.79x the average wage).
// n: nurse pay relative to the US level (OECD Health at a Glance 2025, figure 8.15: hospital nurses' ratio to the average wage).
// pti: estimated years of the average wage needed to buy a typical family home (game estimate).
// bmi: percent of adults with a body-mass index of 25 or more, and of 30 or more (WHO estimates for 2022, age-standardised).
// biz: percent of new businesses still open after five years (official statistics; DE and FR use the EU average; MX is second-hand).
//      null = no usable number found: the game then uses BIZ_WORLD, the OECD cross-country figure.
const COUNTRIES = [
  { id: 'US', n: ['United States', ''], cur: 'USD', local: 70627,    usd: 70627,  pti: 5,    g: 1,    d: 1,    n2: 1, bmi: [72.4, 42.0], biz: 51.4 },
  { id: 'CH', n: ['Switzerland', ''],             cur: 'CHF', local: 99430,    usd: 103465, pti: 10,   g: 0.87, d: 0.61, n2: 0.65, bmi: [40.6, 12.1], biz: null },
  { id: 'DE', n: ['Germany', ''],                cur: 'EUR', local: 63288,    usd: 65856,  pti: 8,    g: 0.90, d: 0.70, n2: 0.87, bmi: [53.8, 20.4], biz: 45 },

      '<strong>Top pay.</strong> The game shows what the best-paid 1 in 10 people in a job earn. It counts that as 1.6 times the middle salary, based on six US jobs that were checked.',
      '<strong>Real, US only: who marries whom.</strong> The most likely partner comes from a <a href="https://www.zippia.com/advice/?p=22379">Zippia study of US census data</a> on the most common job of each job’s spouse. Where a job has no number of its own, the game uses the most common match overall, a school teacher. The other numbers are from <a href="https://www.pewresearch.org/short-reads/2022/09/07/college-grads-in-u-s-tend-to-partner-with-each-other-especially-if-their-parents-also-graduated-from-college/">Pew Research Center</a> (2019) and a <a href="https://priceonomics.com/?p=7632">Priceonomics study of 2012 US survey data</a>.',
      '<strong>Real numbers, rough estimate: the body figure.</strong> Each country starts from the share of its adults at each weight level (World Health Organization estimates for 2022, as shown in <a href="https://lumistats.com/rankings/obesity/">World Bank data</a> and a <a href="https://brilliantmaps.com/?p=5888">summary of WHO data</a>). The game then moves it by how job groups differ in a <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5508147/table/tbl1">US survey of workers</a> (2013–2014). Numbers by job exist for only a few countries, so outside the US this is a guess. The three figures stand for a body-mass index under 25, from 25 to 30, and 30 or more.',
'<strong>Real in 8 countries: the chance when you start a business.</strong> It is the share of new businesses still open after five years, from official statistics: <a href="https://ised-isde.canada.ca/site/sme-research-statistics/en/key-small-business-statistics/key-small-business-statistics-2025">Canada</a>, the <a href="https://startbusinessbystate.com/business-survival-rates-by-state/">United States</a>, <a href="https://agenciadenoticias.ibge.gov.br/media/com_mediaibge/arquivos/31b1e5b8c4e3f229b26bd0bc1a5a8e87.pdf">Brazil</a>, the <a href="https://cy.ons.gov.uk/businessindustryandtrade/business/activitysizeandlocation/bulletins/businessdemography/2024/pdf">United Kingdom</a> and <a href="https://en.nocutnews.co.kr/news/6595342">South Korea</a>. Germany and France use the <a href="https://ec.europa.eu/eurostat/cache/htmlpub/key-figures-on-european-business-2022/business_dynamics.html">European Union average</a>, and Mexico a <a href="https://www.researchgate.net/figure/Business-survival-in-OECD-countries_tbl1_361546053">second-hand figure</a>. The other 10 countries use the <a href="https://www.oecd.org/en/publications/cross-country-evidence-on-start-up-dynamics_5jrxtkb9mxtb-en.html">OECD figure of about half</a>. Countries count businesses in different ways, so part of the gap between them is not real.',
            '<strong>People to look up to.</strong> Three well-known people for each focus, from around the world, with at least one woman in each. They are examples, not a ranking of who is best.',
      '<strong>Made up for the game.</strong> Talents, how hard each field is, the job chances, the chances for working abroad and for the top job, the stories of the life choices and what you win or lose, the car and home rules, the ranks, who you marry, the one-line verdict and the life score. “Better than N out of 100” compares you with 2,000 computer players who choose at random.',
      '<strong>This is a game, not career or health advice.</strong> Real life depends on much more than dice.',

>، وتقرير Health at a Glance 2025 عن <a href=\"https://www.oecd.org/en/publications/health-at-a-glance-2025_8f9e3f98-en/full-report/remuneration-of-specialists_a50d2aa8.html\">الطب</a> و<a href=\"https://www.oecd.org/en/publications/health-at-a-glance-2025_8f9e3f98-en/full-report/remuneration-of-nurses_9b98c70c.html\">التمريض</a>). رواتب التعليم غير معدّلة.","<strong>تقدير تقريبي في 7 دول.</strong> للسعودية والصين وجنوب أفريقيا والبرازيل والهند وإندونيسيا ومصر لم تتوفر أرقام كهذه. اللعبة تفترض أن الفروق بين الوظائف هناك مثلها في أمريكا. والرواتب الحقيقية لخريجي الجامعات هناك أعلى مما تُظهره اللعبة غالبًا.","<strong>أعلى أجر.</strong> اللعبة تعرض ما يكسبه أعلى واحد من كل عشرة أجرًا في الوظيفة. وتحسبه 1.6 ضعف الراتب الأوسط، اعتمادًا على ست وظائف أمريكية جرى فحصها.","<strong>حقيقي، لأمريكا فقط: من يتزوج مَن.</strong> شريك الحياة الأرجح مأخوذ من <a href=\"https://www.zippia.com/advice/?p=22379\">دراسة Zippia لبيانات التعداد الأمريكي</a> عن أكثر مهنة شيوعًا لشريك كل مهنة. وحين لا يوجد رقم خاص بالوظيفة تستخدم اللعبة الشريك الأكثر شيوعًا عمومًا، وهو من أهل التعليم المدرسي. والأرقام الأخرى من <a href=\"https://www.pewresearch.org/short-reads/2022/09/07/college-grads-in-u-s-tend-to-partner-with-each-other-especially-if-their-parents-also-graduated-from-college/\">مركز بيو للأبحاث</a> (2019) ومن <a href=\"https://priceonomics.com/?p=7632\">دراسة Priceonomics لبيانات مسح أمريكي عام 2012</a>.","<strong>أرقام حقيقية وتقدير تقريبي: شكل الجسم.</strong> كل دولة تبدأ من نسبة البالغين فيها عند كل مستوى وزن (تقديرات منظمة الصحة العالمية لعام 2022، كما تعرضها <a href=\"https://lumistats.com/rankings/obesity/\">بيانات البنك الدولي</a> و<a href=\"https://brilliantmaps.com/?p=5888\">ملخص لبيانات المنظمة</a>). ثم تحرّكها اللعبة بحسب الفروق بين مجموعات الوظائف في <a href=\"https://pmc.ncbi.nlm.nih.gov/articles/PMC5508147/table/tbl1\">مسح أمريكي للعاملين</a> (2013–2014). أرقام الوظائف متوفرة لدول قليلة فقط، فالنتيجة خارج أمريكا تخمين. والأشكال الثلاثة تعني مؤشر كتلة الجسم: أقل من 25، ومن 25 إلى 30، و30 فأكثر.","<strong>حقيقي في 8 دول: فرصة نجاح المشروع الخاص.</strong> هي نسبة المشاريع الجديدة التي تبقى مفتوحة بعد خمس سنوات، من إحصاءات رسمية: <a href=\"https://ised-isde.canada.ca/site/sme-research-statistics/en/key-small-business-statistics/key-small-business-statistics-2025\">كندا</a> و<a href=\"https://startbusinessbystate.com/business-survival-rates-by-state/\">الولايات المتحدة</a> و<a href=\"https://agenciadenoticias.ibge.gov.br/media/com_mediaibge/arquivos/31b1e5b8c4e3f229b26bd0bc1a5a8e87.pdf\">البرازيل</a> و<a href=\"https://cy.ons.gov.uk/businessindustryandtrade/business/activitysizeandlocation/bulletins/businessdemography/2024/pdf\">بريطانيا</a> و<a href=\"https://en.nocutnews.co.kr/news/6595342\">كوريا الجنوبية</a>. ألمانيا وفرنسا تستخدمان <a href=\"https://ec.europa.eu/eurostat/cache/htmlpub/key-figures-on-european-business-2022/business_dynamics.html\">متوسط الاتحاد الأوروبي</a>، والمكسيك <a href=\"https://www.researchgate.net/figure/Business-survival-in-OECD-countries_tbl1_361546053\">رقمًا منقولًا</a>. والدول العشر الأخرى تستخدم <a href=\"https://www.oecd.org/en/publications/cross-country-evidence-on-start-up-dynamics_5jrxtkb9mxtb-en.html\">رقم OECD وهو نحو النصف</a>. وطرق عدّ المشاريع تختلف بين الدول، فجزء من الفرق بينها غير حقيقي.","<strong>القدوات.</strong> ثلاث شخصيات معروفة لكل مسار من أنحاء العالم، بينها امرأة واحدة على الأقل. هي أمثلة وليست ترتيبًا للأفضل.","<strong>من اختراع اللعبة.</strong> المواهب، وصعوبة كل مجال، وفرص الوظائف، وفرصة العمل في الخارج وفرصة المنصب الأعلى، وقصص قرارات الحياة وما يُربح أو يُخسر فيها، وقواعد السيارة والبيت، والمناصب، وشريك الحياة، وجملة الحكم الساخرة، ودرجة الحياة. وعبارة «أفضل من كذا من 100» تقارن النتيجة بألفي لاعب حاسوبي يختارون عشوائيًا.","<strong>هذه لعبة وليست نصيحة مهنية أو صحية.</strong> الحياة الحقيقية تعتمد على ما هو أكثر بكثير من النرد."]}},"es":{"d":{"United States":"Estados Unidos","Switzerland":"Suiza","Germany":"Alemania","United Kingdom":"Reino Unido","France":"Francia","Canada":"Canadá en moto pequeña.","Conduce un coche pequeño y viejo.","Conduce un coche pequeño.","Conduce un coche familiar."],"elseTitle":"Mismo empleo, otro país","elseH":"Sueldo más alto de tu mejor primer empleo ({job}) en cada uno de los {n} países, en dólares de EE. UU. al año","restart":"Girar una vida nueva","again":"Quedarme en {c} y elegir otra vez","srcH":"De dónde salen los números","srcLead":"Esto es un juego. Los sueldos salen de estadísticas reales. Los dados, las decisiones y las notas son inventados.","src":["<strong>Real: average pay in each country.</strong> From the OECD, a group of countries that collects statistics (<a href=\"https://www.oecd-ilibrary.org/en/publications/pensions-at-a-glance-2025_e40274c1-en/full-report/average-wage_da2c17cc\">Pensions at a Glance 2025</a>, numbers for 2024). Egypt’s number comes from its statistics agency, as reported by <a href=\"https://wage.is/egypt/\">wage.is</a>.","<strong>Real: what jobs pay.</strong> Each of the 108 jobs starts from what it pays in the United States (<a href=\"https://www.bls.gov/ooh/\">US Bureau of Labor Statistics</a>, May 2025). The game then scales it to your country using average pay.","<strong>Adjusted in 10 richer countries.</strong> There the game also uses OECD numbers on how much graduates, doctors and nurses earn (<a href=\"https://www.oecd.org/en/publications/education-at-a-glance-2026_b4968bbc-en/full-report/what-are-the-earnings-advantages-to-education_61f6b960\">Education at a Glance 2026</a>; Health at a Glance 2025 for <a href=\"https://www.oecd.org/en/publications/health-at-a-glance-2025_8f9e3f98-en/full-report/remuneration-of-specialists_a50d2aa8.html\">doctors</a> and <a href=\"https://www.oecd.org/en/publications/health-at-a-glance-2025_8f9e3f98-en/full-report/remuneration-of-nurses_9b98c70c.html\">nurses</a>). Teachers’ pay is not adjusted.","<strong>A rough guess in 7 countries.</strong> For Saudi Arabia, China, South Africa, Brazil, India, Indonesia and Egypt there were no such numbers. The game assumes jobs compare with each other the way they do in the US. Real graduates there often earn more than the game shows.","<strong>Top pay.</strong> The game shows what the best-paid 1 in 10 people in a job earn. It counts that as 1.6 times the middle salary, based on six US jobs that were checked.","<strong>Real, US only: who marries whom.</strong> The most likely partner comes from a <a href=\"https://www.zippia.com/advice/?p=22379\">Zippia study of US census data</a> on the most common job of each job’s spouse. Where a job has no number of its own, the game uses the most common match overall, a school teacher. The other numbers are from <a href=\"https://www.pewresearch.org/short-reads/2022/09/07/college-grads-in-u-s-tend-to-partner-with-each-other-especially-if-their-parents-also-graduated-from-college/\">Pew Research Center</a> (2019) and a <a href=\"https://priceonomics.com/?p=7632\">Priceonomics study of 2012 US survey data</a>.","<strong>Real numbers, rough estimate: the body figure.</strong> Each country starts from the share of its adults at each weight level (World Health Organization estimates for 2022, as shown in <a href=\"https://lumistats.com/rankings/obesity/\">World Bank data</a> and a <a href=\"https://brilliantmaps.com/?p=5888\">summary of WHO data</a>). The game then moves it by how job groups differ in a <a href=\"https://pmc.ncbi.nlm.nih.gov/articles/PMC5508147/table/tbl1\">US survey of workers</a> (2013–2014). Numbers by job exist for only a few countries, so outside the US this is a guess. The three figures stand for a body-mass index under 25, from 25 to 30, and 30 or more.","<strong>Real in 8 countries: the chance when you start a business.</strong> It is the share of new businesses still open after five years, from official statistics: <a href=\"https://ised-isde.canada.ca/site/sme-research-statistics/en/key-small-business-statistics/key-small-business-statistics-2025\">Canada</a>, the <a href=\"https://startbusinessbystate.com/business-survival-rates-by-state/\">United States</a>, <a href=\"https://agenciadenoticias.ibge.gov.br/media/com_mediaibge/arquivos/31b1e5b8c4e3f229b26bd0bc1a5a8e87.pdf\">Brazil</a>, the <a href=\"https://cy.ons.gov.uk/businessindustryandtrade/business/activitysizeandlocation/bulletins/businessdemography/2024/pdf\">United Kingdom</a> and <a href=\"https://en.nocutnews.co.kr/news/6595342\">South Korea</a>. Germany and France use the <a href=\"https://ec.europa.eu/eurostat/cache/htmlpub/key-figures-on-european-business-2022/business_dynamics.html\">European Union average</a>, and Mexico a <a href=\"https://www.researchgate.net/figure/Business-survival-in-OECD-countries_tbl1_361546053\">second-hand figure</a>. The other 10 countries use the <a href=\"https://www.oecd.org/en/publications/cross-country-evidence-on-start-up-dynamics_5jrxtkb9mxtb-en.html\">OECD figure of about half</a>. Countries count businesses in different ways, so part of the gap between them is not real.","<strong>People to look up to.</strong> Three well-known people for each focus, from around the world, with at least one woman in each. They are examples, not a ranking of who is best.","<strong>Made up for the game.</strong> Talents, how hard each field is, the job chances, the chances for working abroad and for the top job, the stories of the life choices and what you win or lose, the car and home rules, the ranks, who you marry, the one-line verdict and the life score. “Better than N out of 100” compares you with 2,000 computer players who choose at random.","<strong>This is a game, not career or health advice.</strong> Real life depends on much more than dice."]}},"pt":{"d":{"United States":"Estados Unidos","Switzerland":"Suíça","Germany":"Alemanha","United Kingdom":"Reino Unido","France":"França","Canada":"Canadá","Australia":"Austrália","Japan":"Japão","South Korea":"Coreia do Sul","Saudi Arabia":"Arábia Saudita","Türkiye":"Turquia","South Africa":"África do Sul","Mexico":"México","Br s novas fracassa. As que ganham contratos pagam muito mais que um salário.","Start the firm":"Abrir a empresa","Lead the whole division":"Dirigir toda a divisão","The chief engineer is retiring. Going for the job means long hours and office battles. Win and you climb high. Lose and you are pushed aside.":"O engenheiro-chefe vai se aposentar. Tentar a vaga significa muitas horas e brigas de escritório. Se ganhar, você sobe alto. Se perder, fica de lado.","Stay the expert":"Continuar como especialista","A post at head office abroad":"Um cargo na sede, no exterior","Head office in another country wants you. It could boost your whole career. Or the post could be cut after a year.":"A sede, em outro país, quer você. Pode impulsionar toda a sua carreira. Ou o cargo pode ser cortado em um ano.","Take the post":"Aceitar o cargo","Stay where I am":"Ficar onde estou","Start your own company":"Abrir sua própria empresa","You have an idea and some savings. Most new businesses fail. The ones that work pay far more than a salary.":"Você tem uma ideia e algumas economias. A maioria dos negócios novos fracassa. Os que dão certo pagam muito mais que um salário.","Start the company":"Abrir a empresa","Go for the executive seat":"Tentar a cadeira executiva","A top job is opening. Going for it means long hours and office battles. Win and you climb high. Lose and you are pushed aside.":"Um cargo alto vai abrir. Tentar significa muitas horas e brigas de escritório. Se ganhar, você sobe alto. Se perder, fica de lado.","Stay the specialist":"Continuar como especialista","An international firm calls":"Um escritório internacional chama","A big law firm in another country wants you. It could make your career. Or you could be let go after a year.":"Um grande escritório de advocacia de outro país quer você. Pode fazer sua carreira. Ou você pode ser dispensado em um ano.","Join the firm":"Entrar no escritório","Open your own law office":"Abrir seu próprio escritório","You have a few loyal clients and some savings. Many new offices struggle. The ones that work pay far more than a salary.":"Você tem alguns clientes fiéis e algumas economias. Muitos escritórios novos passam aperto. Os que dão certo pagam muito mais que um salário.","Open the office":"Abrir o escritório","Go for the top seat":"Tentar o cargo mais alto","An international school abroad":"Uma escola internacional no exterior","An international school in another country offers you a post. It pays well and could boost your career. Or the contract could end after a year.":"Uma escola internacional de outro país oferece uma vaga. Paga bem e pode impulsionar sua carreira. Ou o contrato pode acabar em um ano.","Stay at my school":"Ficar na minha escola","Open a learning centre":"Abrir um centro de estudos","You have an idea for a tutoring centre and some savings. Most new centres fail. The ones that fill up pay far more than a salary.":"Você tem uma ideia de cursinho e algumas economias. A maioria dos centros novos fracassa. Os que enchem pagam muito mais que um salário.","Open the centre":"Abrir o centro","Go for the top education job":"Tentar o cargo mais alto da educação","A top job is opening. Going for it means politics and paperwork. Win and you climb high. Lose and you are pushed aside.":"Um cargo alto vai abrir. Tentar significa política e papelada. Se ganhar, você sobe alto. Se perder, fica de lado.","Stay with my students":"Ficar com meus alunos","A famous studio abroad":"Um estúdio famoso no exterior","A well-known studio in another country wants you. It could make your name. Or you could be let go after one project.":"Um estúdio conhecido de outro país quer você. Pode fazer seu nome. Ou você pode ser dispensado depois de um projeto.","Join the studio":"Entrar no estúdio","Open your own studio":"Abrir seu próprio estúdio","You have a few clients and some savings. Most new studios fail. The ones that win big clients pay far more than a salary.":"Você tem alguns clientes e algumas economias. A maioria dos estúdios novos fracassa. Os que ganham clientes grandes pagam muito mais que um salário.","Open the studio":"Abrir o estúdio","Go for creative director":"Tentar a direção de criação","The top creative job is opening. Going for it means less design and more office battles. Win and you climb high. Lose and you are pushed aside.":"O cargo criativo mais alto vai abrir. Tentar significa criar menos e brigar mais no escritório. Se ganhar, você sobe alto. Se perder, fica de lado.","Stay the designer":"Continuar criando","A research post abroad":"Uma vaga de pesquisa no exterior","A top lab in another country offers you a post. It could make your name. Or the grant could run out after a year.":"Um laboratório de ponta de outro país oferece uma vaga. Pode fazer seu nome. Ou a bolsa pode acabar em um ano.","Stay in my lab":"Ficar no meu laboratório","Turn your research into a company":"Transformar sua pesquisa em empresa","Your discovery could become a product. Most science startups fail. The ones that work pay far more than a salary.":"Sua descoberta pode virar um produto. A maioria das startups científicas fracassa. As que dão certo pagam muito mais que um salário.","Lead the institute":"Dirigir o instituto","The director is leaving. Going for the job means budgets and politics instead of experiments. Win and you climb high. Lose and you are pushed aside.":"O diretor está saindo. Tentar a vaga significa orçamentos e política no lugar de experimentos. Se ganhar, você sobe alto. Se perder, fica de lado.","Stay in research":"Continuar na pesquisa","A hospital job abroad":"Um emprego em hospital no exterior","A hospital in another country is hiring. The pay is higher and it could boost your career. Or the contract could end after a year.":"Um hospital de outro país está contratando. O salário é maior e pode impulsionar sua carreira. Ou o contrato pode acabar em um ano.","Take the job":"Aceitar o emprego","Open your own practice":"Abrir seu próprio negócio de saúde" ,"again":"Ficar aqui ({c}) e escolher de novo","srcH":"De onde vêm os números","srcLead":"Isto é um jogo. Os salários vêm de estatísticas reais. Os dados, as decisões e as notas são inventados.","src":["<strong>Real: average pay in each country.</strong> From the OECD, a group of countries that collects statistics (<a href=\"https://www.oecd-ilibrary.org/en/publications/pensions-at-a-glance-2025_e40274c1-en/full-report/average-wage_da2c17cc\">Pensions at a Glance 2025</a>, numbers for 2024). Egypt’s number comes from its statistics agency, as reported by <a href=\"https://wage.is/egypt/\">wage.is</a>.","<strong>Real: what jobs pay.</strong> Each of the 108 jobs starts from what it pays in the United States (<a href=\"https://www.bls.gov/ooh/\">US Bureau of Labor Statistics</a>, May 2025). The game then scales it to your country using average pay.","<strong>Adjusted in 10 richer countries.</strong> There the game also uses OECD numbers on how much graduates, doctors and nurses earn (<a href=\"https://www.oecd.org/en/publications/education-at-a-glance-2026_b4968bbc-en/full-report/what-are-the-earnings-advantages-to-education_61f6b960\">Education at a Glance 2026</a>; Health at a Glance 2025 for <a href=\"https://www.oecd.org/en/publications/health-at-a-glance-2025_8f9e3f98-en/full-report/remuneration-of-specialists_a50d2aa8.html\">doctors</a> and <a href=\"https://www.oecd.org/en/publications/health-at-a-glance-2025_8f9e3f98-en/full-report/remuneration-of-nurses_9b98c70c.html\">nurses</a>). Teachers’ pay is not adjusted.","<strong>A rough guess in 7 countries.</strong> For Saudi Arabia, China, South Africa, Brazil, India, Indonesia and Egypt there were no such numbers. The game assumes jobs compare with each other the way they do in the US. Real graduates there often earn more than the game shows.","<strong>Top pay.</strong> The game shows what the best-paid 1 in 10 people in a job earn. It counts that as 1.6 times the middle salary, based on six US jobs that were checked.","<strong>Real, US only: who marries whom.</strong> The most likely partner comes from a <a href=\"https://www.zippia.com/advice/?p=22379\">Zippia study of US census data</a> on the most common job of each job’s spouse. Where a job has no number of its own, the game uses the most common match overall, a school teacher. The other numbers are from <a href=\"https://www.pewresearch.org/short-reads/2022/09/07/college-grads-in-u-s-tend-to-partner-with-each-other-especially-if-their-parents-also-graduated-from-college/\">Pew Research Center</a> (2019) and a <a href=\"https://priceonomics.com/?p=7632\">Priceonomics study of 2012 US survey data</a>.","<strong>Real numbers, rough estimate: the body figure.</strong> Each country starts from the share of its adults at each weight level (World Health Organization estimates for 2022, as shown in <a href=\"https://lumistats.com/rankings/obesity/\">World Bank data</a> and a <a href=\"https://brilliantmaps.com/?p=5888\">summary of WHO data</a>). The game then moves it by how job groups differ in a <a href=\"https://pmc.ncbi.nlm.nih.gov/articles/PMC5508147/table/tbl1\">US survey of workers</a> (2013–2014). Numbers by job exist for only a few countries, so outside the US this is a guess. The three figures stand for a body-mass index under 25, from 25 to 30, and 30 or more.","<strong>Real in 8 countries: the chance when you start a business.</strong> It is the share of new businesses still open after five years, from official statistics: <a href=\"https://ised-isde.canada.ca/site/sme-research-statistics/en/key-small-business-statistics/key-small-business-statistics-2025\">Canada</a>, the <a href=\"https://startbusinessbystate.com/business-survival-rates-by-state/\">United States</a>, <a href=\"https://agenciadenoticias.ibge.gov.br/media/com_mediaibge/arquivos/31b1e5b8c4e3f229b26bd0bc1a5a8e87.pdf\">Brazil</a>, the <a href=\"https://cy.ons.gov.uk/businessindustryandtrade/business/activitysizeandlocation/bulletins/businessdemography/2024/pdf\">United Kingdom</a> and <a href=\"https://en.nocutnews.co.kr/news/6595342\">South Korea</a>. Germany and France use the <a href=\"https://ec.europa.eu/eurostat/cache/htmlpub/key-figures-on-european-business-2022/business_dynamics.html\">European Union average</a>, and Mexico a <a href=\"https://www.researchgate.net/figure/Business-survival-in-OECD-countries_tbl1_361546053\">second-hand figure</a>. The other 10 countries use the <a href=\"https://www.oecd.org/en/publications/cross-country-evidence-on-start-up-dynamics_5jrxtkb9mxtb-en.html\">OECD figure of about half</a>. Countries count businesses in different ways, so part of the gap between them is not real.","<strong>People to look up to.</strong> Three well-known people for each focus, from around the world, with at least one woman in each. They are examples, not a ranking of who is best.","<strong>Made up for the game.</strong> Talents, how hard each field is, the job chances, the chances for working abroad and for the top job, the stories of the life choices and what you win or lose, the car and home rules, the ranks, who you marry, the one-line verdict and the life score. “Better than N out of 100” compares you with 2,000 computer players who choose at random.","<strong>This is a game, not career or health advice.</strong> Real life depends on much more than dice."]}},"fr":{"d":{"United States":"États-Unis","Switzerland":"Suisse","Germany":"Allemagne","United Kingdom":"Royaume-Uni","Australia":"Australie","Japan":"Japon","South Korea":"Corée du Sud","Saudi Arabia":"Arabie saoudite","Türkiye":"Turquie","China":"Chine","South Africa":"Afrique du Sud","Mexico":"Mexique","Brazil":"Brésil","India":"Inde","Indonesia":"Indonésie","Egypt":"Égypte","Numbers":"Chiffres","Maths and logic come easily to you":"Les maths et la logique sont faciles pour toi","Words":"Mots","You write and argue well":"Tu écris et argumentes bien","People":"Relations","You read people and lead them":"Tu comprends les gens et tu sai
