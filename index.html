    const wheel = (x, r, y) => `<circle cx="${x}" cy="${y}" r="${r}" fill="var(--wheel)" stroke="${tone}" stroke-width="2.5"/><circle cx="${x}" cy="${y}" r="${r / 3.2}" fill="${tone}"/>`;
    let art;
    if (i === 0) art = wheel(30, 10, 34) + wheel(86, 10, 34) +
      `<path d="M30 34 L50 16 L76 16 L86 34 M50 16 L60 34 L30 34 M76 16 L60 34 M46 13 H56 M76 16 L80 9 H86" fill="none" stroke="${tone}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>`;
    else if (i === 1) art = `<path d="M20 31 Q20 20 34 20 H48 V31 Z" fill="${tone}"/><rect x="46" y="27" width="32" height="4" rx="2" fill="${tone}"/><rect x="22" y="14" width="26" height="4" rx="2" fill="${tone}"/>` +
      `<path d="M78 30 L84 10 M76 10 H88 M82 22 L90 36" stroke="${tone}" stroke-width="3.5" stroke-linecap="round" fill="none"/>` + wheel(28, 7, 36) + wheel(90, 7, 36);
    else {
      const k = CAR_SHAPES[CAR_KIND[i]];
      art = `<polygon points="${k.b}" fill="${tone}"/><polygon points="${k.w}" fill="var(--win-off)"/>` +
        (i === 9 ? `<path d="M6 21 H18 L16 29" fill="none" stroke="${tone}" stroke-width="2.5" stroke-linecap="round"/>` : '') +
        (i >= 6 ? `<path d="M${k.x[0] + 12} 29 H${k.x[1] - 12}" stroke="var(--asphalt)" stroke-width="1.5"/>` : '') +
        wheel(k.x[0], k.r, 36) + wheel(k.x[1], k.r, 36);
    }
    return `<svg class="art" viewBox="0 0 120 48" role="img" aria-label="${band(CARS[i]).replace(/"/g, '')}">${art}</svg>`;
  }
  function homeSVG(i) {
    const wall = 'fill="var(--asphalt-3)" stroke="var(--paint)" stroke-width="2" stroke-linejoin="round"';
    const win = (x, y, lit) => `<rect x="${x}" y="${y}" width="7" height="7" fill="${lit ? 'var(--win-on)' : 'var(--win-off)'}"/>`;
    const grid = (xs, ys, litX, litY) => ys.map(y => xs.map(x => win(x, y, x === litX && y === litY)).join('')).join('');
    const art = [
      `<rect x="6" y="38" width="22" height="20" ${wall}/><rect x="92" y="38" width="22" height="20" ${wall}/><rect x="26" y="28" width="68" height="30" ${wall}/><polygon points="20,28 60,8 100,28" ${wall}/>` +
        `<rect x="55" y="42" width="10" height="16" fill="var(--paint)"/>` + [34, 44, 70, 80].map(x => win(x, 35, true)).join('') + win(13, 44, true) + win(100, 44, true),
      `<rect x="74" y="12" width="6" height="12" ${wall}/><rect x="34" y="30" width="52" height="28" ${wall}/><polygon points="28,30 60,10 92,30" ${wall}/>` +
        `<rect x="56" y="42" width="9" height="16" fill="var(--paint)"/>` + win(41, 38, true) + win(72, 38, true),
      `<rect x="22" y="26" width="36" height="32" ${wall}/><rect x="62" y="26" width="36" height="32" ${wall}/><polygon points="20,26 40,12 60,26" ${wall}/><polygon points="60,26 80,12 100,26" ${wall}/>` +
        `<rect x="36" y="44" width="8" height="14" fill="var(--paint)"/><rect x="76" y="44" width="8" height="14" fill="var(--muted)"/>` + win(27, 33, true) + win(46, 33, true) + win(67, 33, false) + win(86, 33, false),
      `<rect x="36" y="14" width="48" height="44" ${wall}/>` + grid([43, 56.5, 70], [20, 32, 44], 56.5, 32),
      `<rect x="42" y="4" width="36" height="54" ${wall}/>` + grid([49, 64], [9, 19, 29, 39], 49, 29) + `<rect x="56" y="49" width="8" height="9" fill="var(--muted)"/>`,
      `<rect x="14" y="26" width="92" height="32" ${wall}/>` + grid([20, 33, 46, 59, 72, 85, 95], [31, 43], 59, 43),
    ][i];
    return `<svg class="art" viewBox="0 0 120 64" role="img" aria-label="${band(HOMES[i]).replace(/"/g, '')}"><path d="M2 59 H118" stroke="var(--edge)" stroke-width="2"/>${art}</svg>`;
  }
  // A plain figure with no marks of a man or a woman. i: 0 slim, 1 fit, 2 obese.
  const BODY = [
    { sh: 10.5, mid: 8.5, hip: 8.5, leg: 6.4, arm: 4.4, out: 3.5 },
    { sh: 13.5, mid: 12.5, hip: 11.5, leg: 9.2, arm: 5.8, out: 4.5 },
    { sh: 14.5, mid: 25, hip: 16.5, leg: 13, arm: 7, out: 9.5 },
  ];
  function bodySVG(i) {
    const b = BODY[i], cx = 30, legX = b.hip / 2 + 0.5, ax = b.sh - b.arm / 2 + 1.2;
    return `<svg class="art body" viewBox="0 0 60 104" aria-hidden="true" fill="currentColor" stroke="currentColor" stroke-linecap="round">
      <circle cx="${cx}" cy="11" r="8.5" stroke="none"/>
      <path stroke="none" d="M${cx - b.sh} 30 Q${cx - b.sh} 23 ${cx - b.sh + 6} 23 H${cx + b.sh - 6} Q${cx + b.sh} 23 ${cx + b.sh} 30 C${cx + b.mid} 40 ${cx + b.mid} 54 ${cx + b.hip} 66 L${cx - b.hip} 66 C${cx - b.mid} 54 ${cx - b.mid} 40 ${cx - b.sh} 30Z"/>
      <path fill="none" stroke-width="${b.leg}" d="M${cx - legX} 64 V98 M${cx + legX} 64 V98"/>
      <path fill="none" stroke-width="${b.arm}" d="M${cx - ax} 27 L${cx - ax - b.out} 57 M${cx + ax} 27 L${cx + ax + b.out} 57"/>
    </svg>`;
  }
  // Small drawings for the rows that have no car or home: a case for the job, coins for pay, steps for rank, a heart for marriage.
  const heartSVG = () => `<svg class="art ico" viewBox="0 0 48 44" aria-hidden="true"><path d="M24 41 C10 30 3 22 3 13.5 C3 7 8 2.5 14 2.5 C18.5 2.5 22 5 24 9 C26 5 29.5 2.5 34 2.5 C40 2.5 45 7 45 13.5 C45 22 38 30 24 41Z" fill="var(--heart)"/></svg>`;
  const stairsSVG = i => `<svg class="art ico" viewBox="0 -6 66 52" aria-hidden="true">${[0, 1, 2].map(k =>
    `<rect x="${3 + k * 20}" y="${32 - k * 11}" width="20" height="${11 + k * 11}" fill="${k <= i ? 'var(--lane)' : 'var(--asphalt-3)'}" stroke="var(--paint)" stroke-width="2" stroke-linejoin="round"/>`).join('')}<circle cx="${13 + i * 20}" cy="${24.5 - i * 11}" r="5.5" fill="var(--paint)"/></svg>`;
  const coinsSVG = n => `<svg class="art ico" viewBox="0 0 48 46" aria-hidden="true">${Array.from({ length: n }, (_, k) => { const y = 38 - k * 7;
    return `<path d="M6 ${y - 3} v5 a18 5 0 0 0 36 0 v-5" fill="var(--coin)" stroke="var(--coin-edge)" stroke-width="1.5"/><ellipse cx="24" cy="${y - 3}" rx="18" ry="5" fill="var(--coin)" stroke="var(--coin-edge)" stroke-width="1.5"/>`; }).join('')}</svg>`;
  const caseSVG = tier => `<svg class="art ico" viewBox="0 0 48 44" aria-hidden="true"><path d="M17 12 V8 a3 3 0 0 1 3 -3 h8 a3 3 0 0 1 3 3 v4" fill="none" stroke="var(--paint)" stroke-width="3"/><rect x="4" y="12" width="40" height="27" rx="5" fill="var(--tier-${TIERS[tier]})" stroke="var(--paint)" stroke-width="2"/><path d="M4 24 H44" stroke="var(--paint)" stroke-width="2"/><rect x="20" y="20" width="8" height="8" rx="2" fill="var(--paint)"/></svg>`;
  function weightHTML(R, c) {
    const w = R.weight;
    const more = t('weightTip', { c: L(c.n), a: w.p[0], b: w.p[1], d: w.p[2] });
    return `<span class="weight" role="button" tabindex="0" data-tip="${tipId(more)}" aria-label="${attr(t('weightAria', { s: TEXT[lang].shapes[w.i], p: w.p[w.i] }))}">${bodySVG(w.i)}<span class="num" dir="ltr">${w.p[w.i]}%</span></span>`;
  }
  // Three lanes, one per road. Each road's current vehicle sits at the age that road has reached.
  const lanePos = age => 7 + (age - 18) / (RETIRE - 18) * 86;
  function lanes(list, ages, from) {
    const marks = [22, ...DECISIONS.map(d => d.age), RETIRE];
    return `<div class="lanes${from ? ' drive' : ''}" role="img" aria-label="${t('lanesLabel')}">
      <div class="ages">${marks.map(a => `<span style="left:${lanePos(a)}%">${a}</span>`).join('')}</div>
      ${list.map((R, k) => `<div class="lane r${k + 1}">${marks.map(a => `<i class="tick" style="left:${lanePos(a)}%"></i>`).join('')}
        <span class="veh" style="left:${lanePos(ages[k])}%${from ? `;--from:${lanePos(from[k])}%` : ''}">${carSVG(R.carIdx)}</span></div>`).join('')}
    </div>`;
  }

  /* ---- views ---- */
  const VIEWS = {
    intro: o => birthView(false, o),
    born: o => birthView(true, o),
    majors: majorsView,
    specs: specsView,
    jobs: jobsView,
    life: lifeView,
    lives: livesView,
  };
  const hero = (i, title, more, extra) => `
      <section class="hero">
        <div class="eyebrow">${t('step', { i })}</div>
        <h2>${title} ${more ? tip(more) : ''}</h2>
        ${extra || ''}
      </section>`;

  /* ---- birth: the wheel ---- */
  const SLICE = 360 / COUNTRIES.length;
  const restAngle = id => { const i = COUNTRIES.findIndex(c => c.id === id); return i < 0 ? 0 : (360 - i * SLICE) % 360; };
  function wheelHTML(hit) {
    const a = SLICE / 2 * Math.PI / 180, R = 100, x = (R * Math.sin(a)).toFixed(2), y = (-R * Math.cos(a)).toFixed(2);
    const deg = hit ? (wheelAt.id === hit ? wheelAt.deg : restAngle(hit)) : 0;
    const slices = COUNTRIES.map((c, i) => `<g transform="rotate(${(i * SLICE).toFixed(2)})"${c.id === hit ? ' class="hit"' : ''}><title>${L(c.n)} · ${usd(c.usd)}</title>
      <path d="M0 0 L-${x} ${y} A${R} ${R} 0 0 1 ${x} ${y} Z" fill="var(--w${i % 6 + 1})"/><text x="0" y="-76" text-anchor="middle">${c.id}</text></g>`).join('');
    return `<div class="wheel-wrap" role="img" aria-label="${t('wheelLabel', { n: COUNTRIES.length })}">
      <div class="wheel-disc" id="wheel" style="transform:rotate(${deg.toFixed(2)}deg)"><svg viewBox="-104 -104 208 208">${slices}<circle r="101" fill="none" stroke="var(--wheel-rim)" stroke-width="5"/></svg></div>
      <div class="wheel-pin" aria-hidden="true"></div>
      <div class="wheel-hub${hit ? ' got' : ''}" id="hub" aria-hidden="true">${hit || '?'}</div>
    </div>`;
  }

  function birthView(born, opts) {
    const c = country(), n = COUNTRIES.length, A = born && opts.animate;
    const facts = born
      ? `<div>${t('avgWage')} <span class="num">${local(c, c.usd)}</span> ${t('aYear')} ${tip((alsoUSD(c, c.usd) ? usd(c.usd) + '. ' : '') + (c.id === 'US' ? t('usBench') : t('vsUS', { p: Math.max(1, Math.round(c.usd / US_AW * 100)) })))}</div>` : '';
    const full = state.talents.length === 2;
    const talents = born ? `
          <div class="tal-head"><span class="eyebrow">${t('talentsPick')} · <span dir="ltr">${state.talents.length}/2</span></span>${tip(t(state.challenge ? 'challengeOn' : 'talentsTip', { b: TALENT_BONUS }))}</div>
          <div class="tal-grid${A ? ' deal' : ''}">${TALENT_IDS.map((id, k) => {
            const on = state.talents.includes(id), helps = MAJORS.filter(m => m.tal.includes(id));
            const more = `<strong>${L(TALENTS[id].n)}</strong><br>${t('talentTip', { d: L(TALENTS[id].d), m: helps.map(m => L(m.n)).join(AR() ? '' : ', ') })}`;
            return `<div class="tal-pick${on ? ' on' : ''}${!on && (full || state.challenge) ? ' off' : ''}" role="button" tabindex="0" data-act="talent" data-id="${id}" aria-pressed="${on}" style="--i:${k}">
              <strong>${L(TALENTS[id].n)}</strong><span class="small">${t('helpsN', { n: helps.length })}</span>${tip(more)}</div>`; }).join('')}
          </div>
          ${full ? `<div class="codebar">
            <span class="eyebrow">${t('codeK')}</span><span class="num codeval" dir="ltr">${code()}</span>
            <button class="btn slim" data-act="copy-code">${t('copyCode')}</button>${tip(t('codeNote'))}
            ${codeMsg ? `<span role="status">${t('codeCopied')}</span>` : ''}
          </div>` : ''}` : '';
    return `
      <section class="hero">
        <h1>${t('brand')}</h1>
        <p class="lede">${t('lede')}</p>
      </section>
      <section class="birth">
        ${wheelHTML(born ? c.id : null)}
        <div class="stack">
          <div class="sign${A ? ' land' : ''}" aria-live="polite">
            <div class="label">${t('yourBirthplace')} ${tip(t('wheelTip', { n }))}</div>
            <div class="place" id="place">${born ? L(c.n) : t('notDrawn')}</div>
            <div class="facts">${facts}</div>
          </div>
          ${talents}
          <div class="actions main">
            ${born
              ? `<button class="btn go" data-act="to-majors" ${full ? '' : 'disabled'}>${t('toMajors')}</button>${state.challenge ? `<button class="btn" data-act="restart">${t('rerollBirth')}</button>` : ''}`
              : `<button class="btn go big" data-act="roll-country">${t('spin')}</button><button class="btn" data-tip="help">${t('howGoes')}</button>`}
          </div>
          ${born ? '' : `
          <details class="codebox" id="codebox"${codeOpen || codeErr ? ' open' : ''}>
            <summary>${t('haveCode')}</summary>
            <form class="codeform" id="codeform">
              <div class="actions"><input id="code" name="code" aria-label="${t('codeK')}" autocomplete="off" spellcheck="false" maxlength="20" placeholder="BR-NUM-CAR" value="${codeDraft}" dir="ltr"><button class="btn" type="submit">${t('useCode')}</button></div>
              ${codeErr ? `<span class="warn" role="alert">${t('badCode')}</span>` : ''}
            </form>
          </details>`}
        </div>
      </section>`;
  }

  /* ---- majors ---- */
  function majorRange(c, m) {
    const all = m.specs.flatMap(s => s.jobs.map(j => payUSD(c, s, j[2])));
    return [Math.min(...all), Math.max(...all)];
  }
  const oddsBar = (o, words) => `<div class="bar" role="img" aria-label="${o.map((p, i) => TEXT[lang].tier[i] + ' ' + p + '%').join(', ')}">${
    o.map((p, i) => `<span class="${TIERS[i]}" style="width:${p}%">${words ? TEXT[lang].tier[i] + ' ' : ''}${p}%</span>`).join('')}</div>`;
  const legend = () => `<div class="legend">${TIERS.map((x, i) => `<span><i style="background:var(--tier-${x})"></i>${TEXT[lang].tierJob[i]}</span>`).join('')}</div>`;
  const diffTag = d => word(TEXT[lang].diff[d], TEXT[lang].diffTip[d], 'tag diff-' + d);
  const luckHTML = () => `<strong>${t('luckH')}</strong><p>${t('luck1')}</p><ol class="plain">${TEXT[lang].luckList.map(x => `<li>${x}</li>`).join('')}</ol>
    <div class="odds-table">${['a', 'b', 'c'].map(d => `<div class="odds-row"><span>${TEXT[lang].diff[d]}</span>${oddsBar(BASE_ODDS[d])}</div>`).join('')}</div>${legend()}<p>${t('luck3')}</p>`;

  function majorsView() {
    const c = country();
    const fit = m => talentMatches(m, state.talents).length;
    const cards = [...MAJORS].sort((a, b) => fit(b) - fit(a)).map((m, n) => {
      const k = state.picks.indexOf(m.id);
      const [lo, hi] = majorRange(c, m);
      const hits = talentMatches(m, state.talents);
      const starts = m.specs.map(s => specStart(m, s)), sLo = Math.min(...starts), sHi = Math.max(...starts);
      const more = `<strong>${L(m.n)}</strong><div class="k">${t('focusK')}</div><ul>${m.specs.map(s => `<li>${L(s.n)}</li>`).join('')}</ul>`;
      return `<div class="major r${k + 1} fit${hits.length}" role="button" tabindex="0" data-act="pick" data-id="${m.id}" aria-pressed="${k >= 0}" style="--i:${n}">
        ${k >= 0 ? `<span class="pick">${k + 1}</span>` : ''}
        <h3>${L(m.n)}</h3>
        <div class="num small"><span dir="ltr">${local(c, lo)}</span> ${t('to')} <span dir="ltr">${local(c, hi)}</span></div>
        <div class="tags">${diffTag(m.diff)}<span class="tag">${t('studyTo', { a: sLo === sHi ? sLo : sLo + '–' + sHi })}</span>
          ${hits.map(id => `<span class="tag hit">${t('match', { t: L(TALENTS[id].n), b: TALENT_BONUS })}</span>`).join('')}${tip(more)}</div>
      </div>`;
    }).join('');
    const slots = [0, 1, 2].map(k => {
      const m = state.picks[k] && byId(MAJORS, state.picks[k]);
      return m
        ? `<button class="slot full r${k + 1}" data-slot="${k}" data-act="pick" data-id="${m.id}" aria-label="${attr(t('removePick', { m: L(m.n) }))}"><span class="code">${k + 1}</span><span class="nm">${L(m.n)}</span><span class="x" aria-hidden="true">×</span></button>`
        : `<span class="slot r${k + 1}" data-slot="${k}"><span class="code">${k + 1}</span><span class="nm">${t('slotEmpty', { i: k + 1 })}</span></span>`;
    }).join('');
    return hero(2, t('majorsH'), t('majorsTip', { c: L(c.n) }), `<div class="actions"><button class="btn slim" data-tip="${tipId(luckHTML())}">${t('luckH')}</button></div>`) + `
      <section class="grid-majors">${cards}</section>
      <div class="tray actions main">
        <div class="slots">${slots}</div>
        <button class="btn go" data-act="to-specs" ${state.picks.length === 3 ? '' : 'disabled'}>${t('openRoads')}</button>
      </div>`;
  }
  // The picked major slides from its card into its road slot.
  function fly({ k, from }) {
    const slot = document.querySelector(`.slot[data-slot="${k}"]`);
    if (!slot || !slot.animate || reduce()) return;
    const to = slot.getBoundingClientRect();
    slot.animate([{ transform: `translate(${from.left - to.left}px, ${from.top - to.top}px)`, opacity: 0.35 }, { transform: 'none', opacity: 1 }],
      { duration: 420, easing: 'cubic-bezier(.2,.8,.2,1)' });
  }

  // Phone only: three buttons that jump between the road cards. done[k] marks a road that needs nothing more.
  function pager(done) {
    return `<nav class="pager" aria-label="${t('lanesLabel')}">${[0, 1, 2].map(k =>
      `<button class="r${k + 1}${done && !done[k] ? ' todo' : ''}" data-act="jump" data-k="${k}">${k + 1}${done && done[k] ? ' ✓' : ''}</button>`).join('')}</nav>`;
  }
  const strip = () => document.querySelector('.roads, .lives');
  function jump(k, smooth) {
    const el = strip(); if (!el || !el.children[k]) return;
    if (el.scrollWidth <= el.clientWidth + 4) return;                 // not a swipe strip on wide screens
    el.children[k].scrollIntoView({ inline: 'center', block: 'nearest', behavior: smooth && !reduce() ? 'smooth' : 'auto' });
  }
  function roadHead(k, m, sub) {
    return `<div class="road-head r${k + 1}"><span class="code">${k + 1}</span><span class="who">${L(m.n)}</span><span class="sub">${sub}</span></div>`;
  }
  const jobTip = (j, x) => `<strong>${L(j)}</strong> · ${TEXT[lang].tierJob[x]}<br>${L(JOB_TIPS[j[0]])}`;

  /* ---- focus ---- */
  function specsView() {
    const c = country();
    const roadsHTML = state.picks.map((id, k) => {
      const m = byId(MAJORS, id);
      const opts = m.specs.map((s, si) => {
        const o = oddsFor(k, m, s, state.talents);
        return `
        <div class="spec" role="button" tabindex="0" data-act="spec" data-id="${id}" data-si="${si}" aria-pressed="${state.specs[id] === si}" style="--i:${k * 3 + si}">
          <h3>${L(s.n)}</h3>
          <div class="tags">${diffTag(specDiff(m, s))}<span class="tag">${t('studyTo', { a: specStart(m, s) })}</span></div>
          <div class="jobs">${s.jobs.map((j, x) =>
            `<div><span class="dot ${TIERS[x]}"></span><span>${word(L(j), jobTip(j, x))}</span><span class="num" dir="ltr">${local(c, payUSD(c, s, j[2]))}</span></div>`).join('')}</div>
          <div class="mini"><span class="k">${t('oddsK')} ${tip(t('oddsTip', { x: local(c, expectedUSD(c, s, o)) }))}</span>${oddsBar(o)}</div>
          <div class="model"><span class="k">${t('heroK')}</span>
            <div class="names">${s.heroes.map(h => word(D(h[0]), `<strong>${D(h[0])}</strong><br>${D(h[2])}`)).join('')}</div>
          </div>
        </div>`; }).join('');
      const hits = talentMatches(m, state.talents);
      const sub = t('roadSub', { o: TEXT[lang].ord[k] }) + (hits.length ? ' · ' + t('match', { t: talentNames(hits), b: TALENT_BONUS * hits.length }) : '');
      return `<div class="road" data-k="${k}">${roadHead(k, m, sub)}${opts}</div>`;
    }).join('');
    const ready = state.picks.every(id => state.specs[id] !== undefined);
    return hero(3, t('specsH'), t('specsTip', { c: L(c.n) }), legend()) + `
      ${pager(state.picks.map(id => state.specs[id] !== undefined))}
      <section class="roads">${roadsHTML}</section>
      <div class="actions main">
        <button class="btn go" data-act="draw" ${ready ? '' : 'disabled'}>${t('rollJobs')}</button>
        <button class="btn" data-act="back-majors">${t('changeMajors')}</button>
      </div>`;
  }

  /* ---- one road's current state ---- */
  // upto: how many decisions to count (all made so far by default).
  function road(k, upto) {
    const c = country(), m = byId(MAJORS, state.picks[k]), si = state.specs[m.id];
    const decs = (state.decs || []).map(step => step[k]).slice(0, upto == null ? DECISIONS.length : upto);
    const rk = state.ranks ? state.ranks[k] : null;
    return Object.assign({ k, si, roll: state.rolls[k].u, odds: oddsFor(k, m, m.specs[si], state.talents), decs, rankRoll: rk ? rk.u : null },
      life(c, m, si, state.rolls[k].tier, decs, rk ? rk.i : null));
  }
  const roads = upto => state.picks.map((_, k) => road(k, upto));

  /* ---- first job: three reels ---- */
  const REEL_ROWS = 24, REEL_STOP = 18;       // the reel stops with row 18, 19 or 20 in the middle window
  function jobsView(opts) {
    const list = roads(0);
    const cards = list.map(R => `<div class="draw reel-card r${R.k + 1}" data-k="${R.k}">
        ${roadHead(R.k, R.major, L(R.spec.n))}
        <div class="mini"><span class="k">${t('oddsK')}</span>${oddsBar(R.odds, true)}</div>
        <div class="reel" aria-hidden="true"><div class="reel-strip">${Array.from({ length: REEL_ROWS }, (_, n) =>
          `<div class="reel-row"><span class="dot ${TIERS[n % 3]}"></span><span>${L(R.spec.jobs[n % 3])}</span></div>`).join('')}</div></div>
        <div class="outcome" aria-live="polite"></div>
      </div>`).join('');
    return hero(4, t('drawH'), t('drawTip')) + `
      ${lanes(list, list.map(R => specStart(R.major, R.spec)), opts.animate ? list.map(() => 18) : null)}
      <section class="reels">${cards}</section>
      <div class="actions main"><button class="btn go" data-act="to-life" id="toLife" disabled>${t('toLife')}</button><span class="muted small skip-hint">${t('skipHint')}</span></div>`;
  }
  function outcomeHTML(R) {
    const c = country();
    const dice = t('diceTip', { u: dec(R.roll, 1), o: '<span dir="ltr">' + R.odds.map(p => p + '%').join(' / ') + '</span>' });
    return `<span class="job">${word(L(R.job), jobTip(R.job, R.tier))}</span>
      <span><span class="pill ${TIERS[R.tier]}">${TEXT[lang].tier[R.tier]}</span> <span class="num" dir="ltr">${local(c, R.start)}</span> ${t('aYear')}${alsoUSD(c, R.start) ? ' <span class="muted small" dir="ltr">' + alsoUSD(c, R.start) + '</span>' : ''} ${tip(dice)}</span>`;
  }
  async function playReels(animate) {
    const list = roads(0), cards = list.map(R => document.querySelector(`.reel-card[data-k="${R.k}"]`));
    if (cards.some(x => !x)) return;
    const strips = cards.map(x => x.querySelector('.reel-strip'));
    const end = k => `translateY(${(-(REEL_STOP + list[k].tier - 1) / REEL_ROWS * 100).toFixed(3)}%)`;
    const settle = k => {
      strips[k].style.transition = 'none'; strips[k].style.transform = end(k);
      cards[k].classList.add('done');
      cards[k].querySelector('.outcome').innerHTML = outcomeHTML(list[k]);
    };
    if (animate && !reduce()) {
      beginShow();
      try {
        strips.forEach(s => { s.style.transition = 'none'; s.style.transform = 'translateY(0)'; });
        void strips[0].offsetHeight;
        strips.forEach((s, k) => { s.style.transition = `transform ${1.15 + k * 0.6}s cubic-bezier(.12,.72,.18,1)`; s.style.transform = end(k); });
        for (let k = 0; k < 3; k++) { await pause(k === 0 ? 1200 : 600); if (!cards[k].isConnected) return; settle(k); }
      } finally { endShow(); }
    } else list.forEach((_, k) => settle(k));
    const b = $('#toLife'); if (b) b.disabled = false;
  }

  /* ---- life choices ---- */
  function effect(e) {
    const parts = [];
    if (e.pay) parts.push(t('effPay', { x: pct(e.pay) }));
    if (e.rank > 0) parts.push(t('effRankUp'));
    if (e.rank < 0) parts.push(t('effRankDown'));
    return parts.join(AR() ? '' : ', ');
  }
  function rankList(R, reachedIdx) {
    return `<div class="ranks">${[...R.ranks].sort((a, b) => b.p - a.p).map((r, i) =>
      `<div class="${(reachedIdx == null ? i === 0 : r.i === reachedIdx) ? 'top' : ''}${reachedIdx != null && r.i === reachedIdx ? ' got' : ''}"><span class="num">${i + 1}</span><span>${L(r.n)}</span><span class="num">${r.p}%</span><span class="num" dir="ltr">${local(country(), r.usd)}</span></div>`).join('')}</div>`;
  }
  const chanceBar = p => `<div class="bar chance" role="img" aria-label="${attr(t('works', { p }))}"><span class="high" style="width:${p}%">${p}%</span><span class="low" style="width:${100 - p}%"></span></div>`;

  // What is real and what is made up behind each of the three choices.
  function factFor(i, c) {
    if (i === 0) return t('factAbroad');
    if (i === 2) return t('factTop');
    const eu = c.id === 'DE' || c.id === 'FR';
    return c.biz ? t(eu ? 'factBizEu' : 'factBiz', { c: L(c.n), p: Math.round(c.biz) }) : t('factBizNone', { c: L(c.n), p: BIZ_WORLD });
  }
  function lifeView(opts) {
    const c = country(), i = state.step, D = DECISIONS[i];
    const cols = state.picks.map((_, k) => {
      const before = road(k, i), d = state.decs[i][k], X = CHOICES[before.major.id][i];
      const p = riskChance(D, before.major, state.talents, c), helped = p > baseChance(D, c);
      const fact = tip(factFor(i, c));
      const justNow = opts.chose === k;
      let body;
      if (!d) {
        body = `
          <div class="story"><h3>${L(X.t)} ${fact}</h3><p>${L(X.x)}</p></div>
          <div class="status"><span class="muted small">${t('lifeStatus')}</span> <span class="num" dir="ltr">${local(c, before.usd)}</span></div>
          <button class="choice risk" data-act="choose" data-k="${k}" data-c="risk">
            <strong>${L(X.r)}</strong>
            ${chanceBar(p)}
            <span class="small">${t('works', { p })}${helped ? ` <span class="tag hit">${t('talentPlus', { b: TALENT_RISK_BONUS })}</span>` : ''}</span>
            <span class="fx"><span class="up">${t('ifWin')}: ${effect(D.risk.win)}</span><span class="down">${t('ifLose')}: ${effect(D.risk.lose)}</span></span>
          </button>
          <button class="choice" data-act="choose" data-k="${k}" data-c="safe">
            <strong>${L(X.s)}</strong>
            <span class="fx"><span>${t('noRisk')}: ${effect(D.safe)}</span></span>
          </button>`;
      } else {
        const after = road(k, i + 1);
        const e = d.c === 'safe' ? D.safe : d.win ? D.risk.win : D.risk.lose;
        const head = d.c === 'safe' ? `<span class="pill plain">${t('safe')}</span>` : `<span class="pill ${d.win ? 'high' : 'low'}">${t(d.win ? 'won' : 'lost')}</span>`;
        const track = d.c === 'safe' ? '' : `
          <div class="track small"><div class="bar"><span class="high" style="width:${p}%">${p}%</span><span class="low" style="width:${100 - p}%"></span></div><div class="marker" style="left:${d.u}%"></div></div>`;
        const show = D.show === 'car'
          ? `<span class="k">${t('showCar')}</span><div class="pic car">${carSVG(after.carIdx)}</div><span class="v">${band(after.car)}</span>`
          : D.show === 'home'
          ? `<span class="k">${t('showHome')}</span><div class="pic home">${homeSVG(after.homeIdx)}</div><span class="v">${band(after.home)}</span>`
          : `<span class="k">${t('showRank')}</span>${rankList(after)}`;
        body = `
          <div class="result" aria-live="polite">
            <div class="story"><h3>${L(X.t)} ${fact}</h3></div>
            <div><strong>${L(d.c === 'safe' ? X.s : X.r)}</strong></div>
            ${track}
            <div class="late">${head} ${effect(e)} ${d.c === 'risk' ? tip(t('rollLine', { u: dec(d.u, 1), p })) : ''}</div>
            <div class="status late"><span class="muted small">${t('lifeStatus')}</span> <span class="num" dir="ltr">${local(c, after.usd)}</span></div>
          </div>
          <div class="reveal late">${show}</div>`;
      }
      const cls = d && justNow ? (d.c === 'risk' && !reduce() ? ' wait' : ' fresh') : '';
      return `<div class="road" data-k="${k}">
        ${roadHead(k, before.major, L(before.job))}
        <div class="draw${cls}">${body}</div>
      </div>`;
    }).join('');
    const done = state.decs[i].every(Boolean), last = i === DECISIONS.length - 1;
    const now = state.picks.map((_, k) => road(k, i + (state.decs[i][k] ? 1 : 0)));
    const prevAge = k => (i === 0 ? specStart(now[k].major, now[k].spec) : DECISIONS[i - 1].age + 2);
    return `
      <section class="hero">
        <div class="eyebrow">${t('step', { i: 5 })} · ${i + 1}/${DECISIONS.length}</div>
        <h2>${t('lifeH', { a: D.age })}</h2>
        <p class="lede">${t('lifeLede')}</p>
      </section>
      ${lanes(now, state.picks.map((_, k) => D.age + (state.decs[i][k] ? 2 : 0)), opts.animate ? state.picks.map((_, k) => prevAge(k)) : null)}
      ${pager(state.decs[i].map(Boolean))}
      <section class="roads">${cols}</section>
      <div class="actions main">
        <button class="btn go" data-act="next-age" ${done ? '' : 'disabled'}>${last ? t('retire') : t('nextAge', { a: DECISIONS[i + 1].age })}</button>
        ${done ? '' : `<span class="muted">${t('decideAll')}</span>`}
      </div>`;
  }
  // The needle swings across the chance bar and settles on the rolled number. Then the result appears.
  function sweep(marker, target) {
    return new Promise(done => {
      const T = 1200, t0 = performance.now();
      (function frame(now) {
        const x = Math.min(1, (now - t0) / T);
        const p = target + Math.pow(1 - x, 2) * 100 * Math.sin(x * 16) * 0.9;
        marker.style.left = Math.max(0, Math.min(100, p)) + '%';
        if (x < 1 && marker.isConnected && !skipping) requestAnimationFrame(frame); else done();
      })(t0);
    });
  }
  async function playNeedle(k) {
    const box = document.querySelector(`.road[data-k="${k}"] .draw`), d = state.decs[state.step][k];
    if (!box || !d) return;
    const marker = box.querySelector('.marker');
    if (marker && box.classList.contains('wait')) {
      beginShow();
      try { await Promise.race([sweep(marker, d.u), pause(1700)]); }
      finally { marker.style.left = d.u + '%'; box.classList.remove('wait'); box.classList.add('fresh'); endShow(); }
    }
    const nextRoad = state.decs[state.step].findIndex(x => !x);
    if (nextRoad >= 0) setTimeout(() => jump(nextRoad, true), 1200);      // a moment to read the result first
  }

  /* ---- retirement ---- */
  function standing(c, list) {
    const best = list.reduce((a, b) => (b.score > a.score ? b : a));
    const key = c.id + ':' + best.score;
    if (pctCache[key] == null) pctCache[key] = percentile(c, best.score, 2000, Math.random);
    const p = pctCache[key];
    const [rk, rv] = roastFor(best, best.decs, best.k, list.map(R => R.score), p);
    const roast = t('roast')[rk].split('{a}').join(rv.a).split('{p}').join(rv.p).split('{car}').join(rv.car == null ? '' : TEXT[lang].roastCar[rv.car]);
    return { best, p, title: TITLES[titleFor(c, best, p, state.decs)], roast };
  }
  function shareText(c, S) {
    return t('shareText', { c: L(c.n), t: talentNames(state.talents), job: L(S.best.job), rank: L(S.best.reached.n),
      pay: local(c, S.best.peak), s: S.best.score, p: S.p, title: L(S.title), roast: S.roast }) + ' ' + t('cardMate', { m: L(S.best.mate.n) }) + '.' + t('shareCode', { code: code() });
  }
  function countUp() {
    const el = $('#bigscore'); if (!el || reduce()) return;
    const to = +el.dataset.to, t0 = performance.now(), T = 1100;
    setTimeout(() => { if (el.isConnected) el.textContent = to; }, T + 500);
    (function frame(now) {
      const x = Math.min(1, (now - t0) / T);
      el.textContent = Math.round(to * (1 - Math.pow(1 - x, 3)));
      if (x < 1 && el.isConnected) requestAnimationFrame(frame);
    })(t0);
  }
  const cell = (k, body, more) => `<div class="cell"><span class="k">${t(k)} ${more ? tip(more) : ''}</span>${body}</div>`;

  function livesView(opts) {
    const c = country();
    const list = roads();
    const S = standing(c, list), best = S.best;
    const n = COUNTRIES.length;
    const both = (x) => local(c, x) + (alsoUSD(c, x) ? ' (' + alsoUSD(c, x) + ')' : '');
    const level = x => 1 + [0.8, 1.3, 2, 3].filter(v => x / c.usd >= v).length;      // 1 to 5 coins, by pay against the country's average
    const cards = list.map(R => `
      <article class="life${R === best ? ' best' : ''}" style="--i:${R.k}">
        ${roadHead(R.k, R.major, L(R.spec.n))}
        ${cell('kScore', `<span class="v score">${R.score}</span>`, t('scoreNote', { a: Math.round(R.payPts), b: R.rankPts, c: R.homePts, y: R.workYears }))}
        ${cell('kJob', `<div class="with-ico"><span class="stack tight"><span class="v">${word(L(R.job), jobTip(R.job, R.tier))}</span><span class="n"><span class="pill ${TIERS[R.tier]}">${TEXT[lang].tier[R.tier]}</span></span></span>${caseSVG(R.tier)}</div>`,
          t('jobNote', { u: dec(R.roll, 1), o: TEXT[lang].ord[R.k] }))}
        <div class="cell"><span class="k">${t('kChoices')}</span>
          <div class="choices">${R.decs.map((d, i) => { const X = CHOICES[R.major.id][i]; return `<div><span class="num">${DECISIONS[i].age}</span><span>${L(d.c === 'safe' ? X.s : X.r)}</span>${
            d.c === 'safe' ? `<span class="pill plain">${t('safe')}</span>` : `<span class="pill ${d.win ? 'high' : 'low'}">${t(d.win ? 'won' : 'lost')}</span>`}</div>`; }).join('')}</div></div>
        ${cell('kSalary', `<div class="with-ico"><span class="stack tight"><span class="v big" dir="ltr">${local(c, R.usd)}</span><span class="n">${t('capAt45')}</span></span>${coinsSVG(level(R.usd))}</div>`,
          (alsoUSD(c, R.usd) ? alsoUSD(c, R.usd) + ' ' + t('aYear') + '. ' : '') + t('salNote', { b: local(c, R.start), m: pct(R.mult) }))}
        ${cell('kCar', `<div class="pic">${carSVG(R.carIdx)}</div><span class="v">${band(R.car)}</span>`, t('budget', { x: both(R.carBudget) }))}
        ${cell('kHome', `<div class="pic">${homeSVG(R.homeIdx)}</div><span class="v">${band(R.home)}</span>`, t('homeNote', { y: R.years < 10 ? dec(R.years, 1) : Math.round(R.years) }))}
        ${cell('kSpouse', `<div class="with-ico"><span class="stack tight"><span class="v mate">${L(R.mate.n)}</span><span class="n">${band(R.spouse)}</span></span>${heartSVG()}</div>`,
          L(R.mate.why) + ' ' + t('spouseNote', { p: GRAD_MATCH, m: L(MARRY[R.major.marry]) }))}
        ${cell('kRank', `<div class="with-ico"><span class="v">${L(R.reached.n)}</span>${stairsSVG(R.reached.i)}</div>`,
          t('rankNote', { u: dec(R.rankRoll, 1), o: '<span dir="ltr">' + R.ranks.map(r => r.p + '%').join(' / ') + '</span>' }))}
        ${cell('kPeak', `<div class="with-ico"><span class="stack tight"><span class="v big" dir="ltr">${local(c, R.peak)}</span><span class="n">${t('capAt65', { r: L(R.reached.n) })}</span></span>${coinsSVG(level(R.peak))}</div>`,
          (alsoUSD(c, R.peak) ? alsoUSD(c, R.peak) + ' ' + t('aYear') + '. ' : '') + t('peakNote'))}
      </article>`).join('');

    const rows = COUNTRIES.map(x => ({ x, v: payUSD(x, best.spec, best.usMedian) })).sort((a, b) => b.v - a.v);
    const max = rows[0].v;
    return `
      <section class="hero">
        <div class="eyebrow">${t('step', { i: 6 })}</div>
        <h2>${t('livesH', { c: L(c.n) })}</h2>
      </section>
      <section class="verdict sign r${best.k + 1}${opts.animate ? ' show' : ''}" id="card">
        <div class="card-top"><span class="label">${t('brand')}</span><span class="label">${L(c.n)} · ${talentNames(state.talents)}</span></div>
        <div class="verdict-main">
          <div class="bigscore"><span class="num" id="bigscore" data-to="${best.score}">${best.score}</span><span class="small">${t('scoreK')} · ${t('outOf')}</span></div>
          <div class="stack tight">
            <div class="place stamp">${L(S.title)}</div>
            <div class="roast">${S.roast}</div>
            <div class="small">${t('pctLine', { p: S.p, c: L(c.n) })}</div>
          </div>
        </div>
        <div class="card-life">
          <div class="pic car">${carSVG(best.carIdx)}</div>
          <div class="pic home">${homeSVG(best.homeIdx)}</div>
          <div class="pic fig">${weightHTML(best, c)}</div>
          <div class="stack tight"><strong>${t('cardLife', { job: L(best.job), rank: L(best.reached.n) })}</strong><span>${t('cardPay', { pay: '<span dir="ltr">' + local(c, best.peak) + '</span>' })}</span><span>${t('cardMate', { m: L(best.mate.n) })}</span></div>
        </div>
        <div class="card-top"><span>${t('codeK')}: <span class="num" dir="ltr">${code()}</span></span></div>
      </section>
      <div class="stack tight">
        <div class="actions">
          <button class="btn go" data-act="share">${t('shareBtn')}</button>
          ${shareMsg === 'ok' ? `<span role="status">${t('copied')}</span>` : `<span class="muted">${t('shotHint')}</span>`}
        </div>
        ${shareMsg === 'fail' ? `<div class="stack tight"><span>${t('copyFail')}</span><textarea id="sharebox" class="sharebox" readonly rows="4">${shareText(c, S)}</textarea></div>` : ''}
      </div>
      ${lanes(list, list.map(() => RETIRE), opts.animate ? list.map(() => DECISIONS[DECISIONS.length - 1].age + 2) : null)}
      ${pager(null)}
      <section class="lives">${cards}</section>
      <section class="panel">
        <div class="eyebrow">${t('elseTitle')} ${tip(t('elseH', { job: L(best.job), n }))}</div>
        <div class="else">${rows.map(r => `<div class="row${r.x.id === c.id ? ' me' : ''}"><span>${L(r.x.n)}</span>
          <span class="b"><i style="width:${(r.v / max * 100).toFixed(1)}%"></i></span><span class="num">${usd(r.v)}</span></div>`).join('')}</div>
      </section>
      <div class="actions">
        <button class="btn go" data-act="restart">${t('restart')}</button>
        <button class="btn" data-act="again">${t('again', { c: L(c.n) })}</button>
      </div>`;
  }

  /* ---- actions ---- */
  async function rollCountry() {
    const idx = Math.floor(rand() * COUNTRIES.length), pick = COUNTRIES[idx];
    const rest = (360 - idx * SLICE + (rand() - 0.5) * SLICE * 0.6 + 360) % 360;      // stops inside the slice, not on its edge
    const wheel = $('#wheel'), hub = $('#hub');
    if (wheel && !reduce()) {
      beginShow();
      try {
        wheel.style.transition = 'none'; wheel.style.transform = 'rotate(0deg)';
        void wheel.offsetHeight;
        wheel.style.transition = 'transform 2.6s cubic-bezier(.1,.62,.08,1)';
        wheel.style.transform = `rotate(${(rest + 360 * 5).toFixed(2)}deg)`;
        if (hub) hub.textContent = '…';
        await pause(2650);
        wheel.style.transition = 'none'; wheel.style.transform = `rotate(${rest.toFixed(2)}deg)`;
      } finally { endShow(); }
    }
    wheelAt = { id: pick.id, deg: rest };
    state.country = pick.id;
    state.talents = [];
    state.challenge = false;
    state.stage = 'born';
    render({ animate: true });
  }
  // Start from a friend's code: same country and talents, fresh choices and dice.
  function startFromCode(text) {
    const got = parseCode(text);
    if (!got) return false;
    state = Object.assign(fresh(), { stage: 'born', country: got.country, talents: got.talents, challenge: true });
    codeErr = false; codeDraft = ''; codeMsg = false; shareMsg = null; codeOpen = false;
    return true;
  }
  document.addEventListener('submit', e => {
    if (e.target.id !== 'codeform') return;
    e.preventDefault();
    if (busy) return;
    const raw = e.target.querySelector('#code').value;
    codeDraft = raw.replace(/[^A-Za-z\- ]/g, '').slice(0, 20);
    if (startFromCode(raw)) return go('born');
    codeErr = true;
    rerenderKeepingPlace('#code');
  });

  function rerenderKeepingPlace(selector, opts) {
    const before = strip(), x = before ? before.scrollLeft : 0;
    const y = window.scrollY; render(opts || {}); window.scrollTo(0, y);
    const after = strip(); if (after) after.scrollLeft = x;
    if (opts && opts.fly) fly(opts.fly);
    const again = selector && document.querySelector(selector); if (again) again.focus({ preventScroll: true });
  }
  document.addEventListener('change', e => {
    if (e.target.id !== 'lang') return;
    if (busy) skipShow();
    setLang(e.target.value);
    rerenderKeepingPlace('#lang');
  });
  function clearRun() { state.picks = []; state.specs = {}; state.rolls = null; state.step = 0; state.decs = null; state.ranks = null; shareMsg = null; }

  // A tap during a show skips the show. If the tap was on a control that is still there afterwards, it then counts.
  document.addEventListener('click', e => {
    if (!busy) return onClick(e);
    skipShow();
    const b = e.target.closest && e.target.closest('[data-act]');
    if (!b) return;
    const sel = `[data-act="${b.dataset.act}"]` + ['k', 'c', 'id', 'si'].map(a => (b.dataset[a] != null ? `[data-${a}="${b.dataset[a]}"]` : '')).join('');
    const retry = n => setTimeout(() => {
      if (busy) { skipShow(); if (n > 0) retry(n - 1); return; }
      const again = document.querySelector(sel);
      if (again) onClick({ target: again, preventDefault() {} });
    }, 40);
    retry(3);
  });
  function onClick(e) {
    const tb = tipOf(e);
    if (tb) {
      e.preventDefault();
      if (pinned === tb) hidePop(); else { hidePop(); pinned = tb; showPop(tb); }
      return;
    }
    if (pinned && !e.target.closest('#pop')) hidePop();
    const b = e.target.closest('[data-act]');
    if (!b || b.disabled) return;
    const act = b.dataset.act;
    if (act === 'roll-country') return rollCountry();
    if (act === 'look') { setLook(look === 'day' ? 'night' : 'day'); return rerenderKeepingPlace('#look'); }
    if (act === 'jump') return jump(+b.dataset.k, true);
    if (act === 'talent') {
      if (state.challenge) return;
      const id = b.dataset.id, k = state.talents.indexOf(id);
      if (k >= 0) state.talents.splice(k, 1); else if (state.talents.length < 2) state.talents.push(id); else return;
      codeMsg = false;
      return rerenderKeepingPlace(`.tal-pick[data-id="${id}"]`);
    }
    if (act === 'to-majors') { if (state.talents.length !== 2) return; return go('majors'); }
    if (act === 'pick') {
      const id = b.dataset.id, k = state.picks.indexOf(id);
      let flyTo = null;
      if (k >= 0) { state.picks.splice(k, 1); delete state.specs[id]; }
      else if (state.picks.length < 3) { state.picks.push(id); flyTo = { k: state.picks.length - 1, from: b.getBoundingClientRect() }; }
      return rerenderKeepingPlace(`.major[data-id="${id}"]`, flyTo ? { fly: flyTo } : null);
    }
    if (act === 'to-specs') return go('specs');
    if (act === 'back-majors') return go('majors');
    if (act === 'spec') {
      state.specs[b.dataset.id] = +b.dataset.si;
      rerenderKeepingPlace(`.spec[data-id="${b.dataset.id}"][data-si="${b.dataset.si}"]`);
      const nextSpec = state.picks.findIndex(id => state.specs[id] === undefined);
      if (nextSpec >= 0) jump(nextSpec, true);
      return;
    }
    if (act === 'draw') {
      state.rolls = state.picks.map((id, k) => {
        const m = byId(MAJORS, id), u = rand() * 100;
        return { u, tier: tierOf(oddsFor(k, m, m.specs[state.specs[id]], state.talents), u) };
      });
      state.step = 0; state.ranks = null; shareMsg = null;
      state.decs = DECISIONS.map(() => [null, null, null]);
      return go('jobs');
    }
    if (act === 'to-life') return go('life');
    if (act === 'choose') {
      const k = +b.dataset.k, i = state.step, D = DECISIONS[i];
      if (state.decs[i][k]) return;
      if (b.dataset.c === 'safe') state.decs[i][k] = { c: 'safe' };
      else {
        const u = rand() * 100;
        state.decs[i][k] = { c: 'risk', u, win: u < riskChance(D, byId(MAJORS, state.picks[k]), state.talents, country()) };
      }
      return rerenderKeepingPlace(null, { chose: k });
    }
    if (act === 'next-age') {
      if (!state.decs[state.step].every(Boolean)) return;
      if (state.step < DECISIONS.length - 1) { state.step++; return go('life'); }
      state.ranks = state.picks.map((_, k) => { const R = road(k), u = rand() * 100; return { u, i: tierOf(R.ranks.map(r => r.p), u) }; });
      go('lives');
      return confetti();
    }
    if (act === 'share') {
      const c = country(), text = shareText(c, standing(c, roads()));
      const finish = ok => { shareMsg = ok ? 'ok' : 'fail'; rerenderKeepingPlace(ok ? '[data-act="share"]' : '#sharebox'); const box = $('#sharebox'); if (box) box.select(); };
      try { navigator.clipboard.writeText(text).then(() => finish(true), () => finish(false)); } catch (err) { finish(false); }
      return;
    }
    if (act === 'copy-code') {
      const done = ok => { codeMsg = ok; rerenderKeepingPlace('[data-act="copy-code"]'); };
      try { navigator.clipboard.writeText(code()).then(() => done(true), () => done(false)); } catch (err) { done(false); }
      return;
    }
    if (act === 'restart') { state = fresh(); shareMsg = null; codeMsg = false; codeErr = false; codeDraft = ''; codeOpen = false; wheelAt = { id: null, deg: 0 }; return go('intro'); }
    if (act === 'again') { clearRun(); return go('majors'); }
  }

  /* ---- boot, keeping a game in progress across a new version of the page ---- */
  function valid(s) {
    if (s.stage === 'intro') return true;
    if (!byId(COUNTRIES, s.country) || !Array.isArray(s.talents) || s.talents.length > 2 || !s.talents.every(x => TALENTS[x])) return false;
    if (s.stage !== 'born' && s.talents.length !== 2) return false;
    if (!(s.picks || []).every(id => byId(MAJORS, id))) return false;
    const i = STAGE_IDS.indexOf(s.stage);
    if (i >= 2 && s.picks.length !== 3) return false;
    if (i >= 3 && !(Array.isArray(s.rolls) && s.rolls.length === 3 && s.picks.every(id => s.specs[id] != null))) return false;
    if (i >= 3 && !(Array.isArray(s.decs) && s.decs.length === DECISIONS.length)) return false;
    if (i >= 5 && !(Array.isArray(s.ranks) && s.ranks.length === 3)) return false;
    return true;
  }
  function start(saved) {
    let wanted = null;
    try { wanted = localStorage.getItem('three-roads-lang'); } catch (e) { /* storage is optional */ }
    if (saved && saved.lang) wanted = saved.lang;
    if (!wanted) { const nav = (navigator.language || 'en').toLowerCase().split('-')[0]; if (LANGS.includes(nav)) wanted = nav; }
    setLang(wanted);
    let wantedLook = null;
    try { wantedLook = localStorage.getItem('three-roads-look'); } catch (e) { /* storage is optional */ }
    setLook((saved && saved.look) || wantedLook || 'day');
    if (saved && saved.stage && VIEWS[saved.stage]) {
      const s = Object.assign(fresh(), saved); delete s.lang; delete s.look;
      state = valid(s) ? s : fresh();
    }
    render();
  }
  window.claude?.hot?.snapshot?.(() => Object.assign({ lang, look }, state));
  if (window.claude?.hot?.ready) window.claude.hot.ready(start); else start(window.claude?.hot?.data ?? {});
})();
</script>
</body>
</html>
