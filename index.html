t d'un an.","Join the firm":"Rejoindre le cabinet","Open your own law office":"Ouvrir ton propre cabinet","You have a few loyal clients and some savings. Many new offices struggle. The ones that work pay far more than a salary.":"Tu as quelques clients fidèles et quelques économies. Beaucoup de nouveaux cabinets ont du mal. Ceux qui marchent rapportent bien plus qu'un salaire.","Open the office":"Ouvrir le cabinet","Go for the top seat":"Viser le poste le plus haut","An international school abroad":"Une école internationale à l'étranger","An international school in another country offers you a post. It pays well and could boost your career. Or the contract could end after a year.":"Une école internationale d'un autre pays t'offre un poste. Elle paie bien et peut lancer ta carrière. Ou le contrat peut s'arrêter au bout d'un an.","Stay at my school":"Rester dans mon école","Open a learning centre":"Ouvrir un centre de soutien scolaire","You have an idea for a tutoring centre and some savings. Most new centres fail. The ones that fill up pay far more than a salary.":"Tu as une idée d'école de soutien et quelques économies. La plupart des nouveaux centres échouent. Ceux qui se remplissent rapportent bien plus qu'un salaire.","Open the centre":"Ouvrir le centre","Go for the top education job":"Viser le plus haut poste de l'éducation","A top job is opening. Going for it means politics and paperwork. Win and you climb high. Lose and you are pushed aside.":"Un poste élevé se libère. Te présenter veut dire politique et paperasse. Si tu gagnes, tu montes haut. Si tu perds, on te met de côté.","Stay with my students":"Rester avec mes élèves","A famous studio abroad":"Un studio célèbre à l'étranger","A well-known studio in another country wants you. It could make your name. Or you could be let go after one project.":"Un studio connu d'un autre pays te veut. Ça peut faire ta réputation. Ou on peut te remercier après un seul projet.","Join the studio":"Rejoindre le studio","Open your own studio":"Ouvrir ton propre studio","You have a few clients and some savings. Most new studios fail. The ones that win big clients pay far more than a salary.":"Tu as quelques clients et quelques économies. La plupart des nouveaux studios échouent. Ceux qui gagnent de gros clients rapportent bien plus qu'un salaire.","Open the studio":"Ouvrir le studio","Go for creative director":"Viser la direction de la création","The top creative job is opening. Going for it means less design and more office battles. Win and you climb high. Lose and you are pushed aside.":"Le plus haut poste créatif se libère. Te présenter veut dire moins de création et plus de politique de bureau. Si tu gagnes, tu montes haut. Si tu perds, on te met de côté.","Stay the designer":"Continuer à créer","A research post abroad":"Un poste de recherche à l'étranger","A top lab in another country offers you a post. It could make your name. Or the grant could run out after a year.":"Un grand laboratoire d'un autre pays t'offre un poste. Ça peut faire ta réputation. Ou la bourse peut s'arrêter au bout d'un an.","Stay in my lab":"Rester dans mon laboratoire","Turn your research into a company":"Transformer ta recherche en entreprise","Your discovery could become a product. Most science startups fail. The ones that work pay far more than a salary.":"Ta découverte pourrait devenir un produit. La plupart des startups scientifiques échouent. Celles qui marchent rapportent bien plus qu'un salaire.","Lead the institute":"Diriger l'institut","The director is leaving. Going for the job means budgets and politics instead of experiments. Win and you climb high. Lose and you are pushed aside.":"Le directeur s'en va. Te présenter veut dire budgets et politique à la place des expériences. Si tu gagnes, tu montes haut. Si tu perds, on te met de côté.","Stay in research":"Rester dans la recherche","A hospital job abroad":"Un emploi dans un hôpital à l'étranger","A hospital in another country is hiring. The pay is higher and it could boost your career. Or the contract could end after a year.":"Un hôpital d'un autre pays recrute. Le salaire est plus élevé et ça peut lancer ta carrière. Ou le contrat peut s'arrêter au bout d'un an.","Take the job":"Accepter l'emploi","Open your own practice":"Ouvrir ta propre activité de santé","A pharmacy or clinic of your own. Many struggle in the first years. The ones that work pay far more than a salary.":"Ta propre pharmacie ou ton propre cabinet. Beaucoup ont du mal les premières années. Ceux qui marchent rapportent bien plus qu'un salaire.","Open it":"Ouvrir","Go for director of services":"Viser la direction des services","A field project abroad":"Un projet de terrain à l'étranger","A big project in another country needs your skills. It could boost your whole career. Or the funding could stop after a year.":"Un grand projet dans un autre pays a besoin de tes compétences. Ça peut lancer toute ta carrière. Ou le financement peut s'arrêter au bout d'un an.","Start a green business":"Créer une entreprise verte","You have an idea and some savings: a farm, a lab or a consultancy. Most new businesses fail. The ones that work pay far more than a salary.":"Tu as une idée et quelques économies : une ferme, un laboratoire ou un cabinet de conseil. La plupart des nouvelles entreprises échouent. Celles qui marchent rapportent bien plus qu'un salaire.","Start the business":"Créer l'entreprise","Lead the programme":"Diriger le programme","Stay in the field":"Rester sur le terrain","A research grant abroad":"Une bourse de recherche à l'étranger","A university in another country offers you a place on a big study. It could make your name. Or the grant could end after a year.":"Une université d'un autre pays t'offre une place dans une grande étude. Ça peut faire ta réputation. Ou la bourse peut s'arrêter au bout d'un an.","Take the grant":"Accepter la bourse","Start your own consultancy":"Créer ton propre cabinet de conseil","Companies and governments pay for expert advice. Most new consultancies fail. The ones that work pay far more than a salary.":"Les entreprises et les gouvernements paient pour des conseils d'experts. La plupart des nouveaux cabinets échouent. Ceux qui marchent rapportent bien plus qu'un salaire.","Start the consultancy":"Créer le cabinet","A big media house abroad":"Un grand média à l'étranger","A famous media company in another country wants you. It could make your name. Or your post could be cut after a year.":"Un média célèbre d'un autre pays te veut. Ça peut faire ta réputation. Ou ton poste peut être supprimé en un an.","Go independent":"Devenir indépendant(e)","Your own channel, studio or publishing house. Most never find an audience. The ones that do pay far more than a salary.":"Ta propre chaîne, ton studio ou ta maison d'édition. La plupart ne trouvent jamais de public. Ceux qui en trouvent gagnent bien plus qu'un salaire.","Go for the top media job":"Viser le plus haut poste des médias","Stay the storyteller":"Continuer à raconter des histoires","Another doctor":"Un(e) autre médecin","In US census data, doctors most often marry other doctors. Nearly 1 in 5 does.":"Dans les données du recensement américain, les médecins épousent surtout d'autres médecins. Presque 1 sur 5.","Another dentist":"Un(e) autre dentiste","In US data, dentists are among the jobs most likely to marry inside their own profession.":"Dans les données américaines, les dentistes font partie des métiers qui se marient le plus entre eux.","A driver":"Un(e) chauffeur/euse","A surprise from US census data: the most common match for nurses is a driver.":"Une surprise du recensement américain : le partenaire le plus courant des infirmiers et infirmières conduit un véhicule pour son travail.","Another software developer":"Un(e) autre développeur/euse","In US census data, software developers most often marry other software developers.":"Dans les données du recensement américain, les développeurs épousent surtout d'autres développeurs.","Another teacher":"Un(e) autre enseignant(e)","In US census data, teachers most often marry other teachers.":"Dans les données du recensement américain, les enseignants épousent surtout d'autres enseignants.","A school teacher":"Un(e) enseignant(e)","In US census data, the most common match for this kind of job is a school teacher. Teachers are the top match for more jobs than anyone else.":"Dans les données du recensement américain, le partenaire le plus courant pour ce type d'emploi enseigne à l'école. Les enseignants sont le partenaire le plus courant pour plus de métiers que n'importe quel autre.","There is no exact number for this job. School teachers are the most common match for most professions in US census data, so the game uses that.":"Il n'y a pas de chiffre exact pour cet emploi. Les enseignants sont le partenaire le plus courant pour la plupart des métiers dans le recensement américain, alors le jeu utilise ça.","A manager":"Un(e) manager","In US census data, marketing and finance managers most often marry other managers.":"Dans les données du recensement américain, les managers en marketing et en finance épousent surtout d'autres managers.","Another lawyer":"Un(e) autre avocat(e)","In US census data, lawyers most often marry other lawyers.":"Dans les données du recensement américain, les avocats épousent surtout d'autres avocats.","Another scientist":"Un(e) autre scientifique","In US census data, physical scientists most often marry other scientists.":"Dans les données du recensement américain, les scientifiques des sciences physiques épousent surtout d'autres scientifiques.","Another pharmacist":"Un(e) autre pharmacien(ne)","In US census data, pharmacists most often marry other pharmacists.":"Dans les données du recensement américain, les pharmaciens épousent surtout d'autres pharmaciens.","No car. You take the bus, the metro or a bike":"Pas de voiture. Tu prends le bus, le métro ou le vélo","A scooter or small motorbike":"Un scooter ou une petite moto","An old, used small car (like a Suzuki Swift)":"Une vieille petite voiture d'occasion (comme une Suzuki Swift)","A new small car (like a Kia Picanto)":"Une petite voiture neuve (comme une Kia Picanto)","A new family car (like a Toyota Corolla)":"Une voiture familiale neuve (comme une Toyota Corolla)","A bigger car or SUV (like a Toyota Camry)":"Une plus grande voiture ou un SUV (comme une Toyota Camry)","A premium car (like a BMW 3 Series)":"Une voiture premium (comme une BMW Série 3)","A big luxury car (like a Mercedes E-Class)":"Une grande voiture de luxe (comme une Mercedes Classe E)","A sports car (like a Porsche 911)":"Une voiture de sport (comme une Porsche 911)","A supercar (like a Ferrari)":"Une supercar (comme une Ferrari)","A big villa that you pay off early":"Une grande villa que tu rembourses tôt","A family house in a good area":"Une maison familiale dans un bon quartier","Your own comfortable flat, paid off with a home loan":"Ton propre appartement confortable, payé avec un crédit","Your own small flat, with a long home loan":"Ton propre petit appartement, avec un long crédit","A rented flat. Buying is too expensive for now":"Un appartement en location. Acheter est trop cher pour l'instant","A shared flat or your family home. Rent takes most of your pay":"Une colocation ou la maison familiale. Le loyer prend presque tout ton salaire","on a small income":"à faible revenu","on a steady income":"à revenu stable","on a good income":"à bon revenu","on a high income":"à revenu élevé","on a very high income":"à très haut revenu","Against the Odds":"Contre toute attente","The Late Bloomer":"Réussite tardive","The Gambler Who Won":"Le pari gagnant","Burned by the Dice":"Brûlé(e) par le dé","Played Safe, Finished Strong":"Prudent(e) mais fort(e)","The Safe Pair of Hands":"Sûr(e) et régulier/ère","Born Lucky, Played It Well":"Bien né(e), bien joué","The Climber":"En pleine ascension","The Dice Were Unkind":"Le dé n'a pas aidé","The Steady Professional":"Professionnel(le) régulier/ère","More than 1 in 5 doctors is married to another doctor.":"Plus d'1 médecin sur 5 est marié à un autre médecin.","About 12 in 100 working couples share the same broad field.":"Environ 12 couples actifs sur 100 partagent le même grand domaine.","About 8 in 100 people in finance are married to someone in finance.":"Environ 8 personnes sur 100 travaillant dans la finance sont mariées à quelqu'un de la finance.","Nearly 15 in 100 people in legal jobs are married to someone in a legal job.":"Près de 15 personnes sur 100 dans les métiers du droit sont mariées à quelqu'un d'un métier du droit.","Teachers often marry teachers. In more than 1 in 3 couples where the husband works in education, the wife does too.":"Les enseignants se marient souvent entre eux. Dans plus d'1 couple sur 3 où le mari travaille dans l'éducation, la femme aussi.","Nearly 11 in 100 people in science jobs are married to someone in science.":"Près de 11 personnes sur 100 dans les métiers scientifiques sont mariées à quelqu'un de la science."},"text":{"brand":"Three Roads","other":"العربية","lookDay":"Mode jour","lookNight":"Mode nuit","steps":["Naissance","Filières","Spécialité","Premier emploi","Choix","Retraite"],"ord":["1er","2e","3e"],"tier":["Bas","Moyen","Haut"],"tierJob":["Emploi à bas salaire","Emploi à salaire moyen","Emploi à haut salaire"],"diff":{"a":"Domaine difficile","b":"Domaine moyen","c":"Domaine sûr"},"diffTip":{"a":"Domaine difficile : il paie plus, mais moins de gens obtiennent l'emploi à haut salaire.","b":"Domaine moyen : une chance normale pour chaque emploi.","c":"Domaine sûr : la plupart des gens obtiennent l'emploi à salaire moyen."},"more":"Plus d'infos","shapes":["mince","en forme","obèse"],"lede":"Tu ne choisis pas où tu nais. Mais tu choisis quoi étudier et quand prendre un risque.","howGoes":"Comment jouer","rules":["<strong>Naissance.</strong> La roue te donne un pays. Les pays riches paient plus. Ensuite tu choisis deux talents.","< try using average pay.","<strong>Adjusted in 10 richer countries.</strong> There the game also uses OECD numbers on how much graduates, doctors and nurses earn (<a href=\"https://www.oecd.org/en/publications/education-at-a-glance-2026_b4968bbc-en/full-report/what-are-the-earnings-advantages-to-education_61f6b960\">Education at a Glance 2026</a>; Health at a Glance 2025 for <a href=\"https://www.oecd.org/en/publications/health-at-a-glance-2025_8f9e3f98-en/full-report/remuneration-of-specialists_a50d2aa8.html\">doctors</a> and <a href=\"https://www.oecd.org/en/publications/health-at-a-glance-2025_8f9e3f98-en/full-report/remuneration-of-nurses_9b98c70c.html\">nurses</a>). Teachers’ pay is not adjusted.","<strong>A rough guess in 7 countries.</strong> For Saudi Arabia, China, South Africa, Brazil, India, Indonesia and Egypt there were no such numbers. The game assumes jobs compare with each other the way they do in the US. Real graduates there often earn more than the game shows.","<strong>Top pay.</strong> The game shows what the best-paid 1 in 10 people in a job earn. It counts that as 1.6 times the middle salary, based on six US jobs that were checked.","<strong>Real, US only: who marries whom.</strong> The most likely partner comes from a <a href=\"https://www.zippia.com/advice/?p=22379\">Zippia study of US census data</a> on the most common job of each job’s spouse. Where a job has no number of its own, the game uses the most common match overall, a school teacher. The other numbers are from <a href=\"https://www.pewresearch.org/short-reads/2022/09/07/college-grads-in-u-s-tend-to-partner-with-each-other-especially-if-their-parents-also-graduated-from-college/\">Pew Research Center</a> (2019) and a <a href=\"https://priceonomics.com/?p=7632\">Priceonomics study of 2012 US survey data</a>.","<strong>Real numbers, rough estimate: the body figure.</strong> Each country starts from the share of its adults at each weight level (World Health Organization estimates for 2022, as shown in <a href=\"https://lumistats.com/rankings/obesity/\">World Bank data</a> and a <a href=\"https://brilliantmaps.com/?p=5888\">summary of WHO data</a>). The game then moves it by how job groups differ in a <a href=\"https://pmc.ncbi.nlm.nih.gov/articles/PMC5508147/table/tbl1\">US survey of workers</a> (2013–2014). Numbers by job exist for only a few countries, so outside the US this is a guess. The three figures stand for a body-mass index under 25, from 25 to 30, and 30 or more.","<strong>Real in 8 countries: the chance when you start a business.</strong> It is the share of new businesses still open after five years, from official statistics: <a href=\"https://ised-isde.canada.ca/site/sme-research-statistics/en/key-small-business-statistics/key-small-business-statistics-2025\">Canada</a>, the <a href=\"https://startbusinessbystate.com/business-survival-rates-by-state/\">United States</a>, <a href=\"https://agenciadenoticias.ibge.gov.br/media/com_mediaibge/arquivos/31b1e5b8c4e3f229b26bd0bc1a5a8e87.pdf\">Brazil</a>, the <a href=\"https://cy.ons.gov.uk/businessindustryandtrade/business/activitysizeandlocation/bulletins/businessdemography/2024/pdf\">United Kingdom</a> and <a href=\"https://en.nocutnews.co.kr/news/6595342\">South Korea</a>. Germany and France use the <a href=\"https://ec.europa.eu/eurostat/cache/htmlpub/key-figures-on-european-business-2022/business_dynamics.html\">European Union average</a>, and Mexico a <a href=\"https://www.researchgate.net/figure/Business-survival-in-OECD-countries_tbl1_361546053\">second-hand figure</a>. The other 10 countries use the <a href=\"https://www.oecd.org/en/publications/cross-country-evidence-on-start-up-dynamics_5jrxtkb9mxtb-en.html\">OECD figure of about half</a>. Countries count businesses in different ways, so part of the gap between them is not real.","<strong>People to look up to.</strong> Three well-known people for each focus, from around the world, with at least one woman in each. They are examples, not a ranking of who is best.","<strong>Made up for the game.</strong> Talents, how hard each field is, the job chances, the chances for working abroad and for the top job, the stories of the life choices and what you win or lose, the car and home rules, the ranks, who you marry, the one-line verdict and the life score. “Better than N out of 100” compares you with 2,000 computer players who choose at random.","<strong>This is a game, not career or health advice.</strong> Real life depends on much more than dice."]}},"it":{"d":{"United States":"Stati Uniti","Switzerland":"Svizzera","Germany":"Germania","United Kingdom":"Regno Unito","France":"Francia","Japan":"Giappone","South Korea":"Corea del Sud","Saudi Arabia":"Arabia Saudita","Türkiye":"Turchia","China":"Cina","South Africa":"Sudafrica","Mexico":"Messico","Brazil":"Brasile","Egypt":"Egitto","Numbers":"Numeri","Maths and logic come easily to you":"Matematica e logica ti vengono facili","Words":"Parole","You write and argue well":"Scrivi e argomenti bene","People":"Persone","You read people and lead them":"Capisci le persone e sai guidarle","Care":"Cura","You are patient with people who need help":"Hai pazienza con chi ha bisogno di aiuto","Making":"Creare","You build and design things well":"Sai costruire e progettare bene le cose","Nature":"Natura","You are curious about animals, plants and the planet":"Ti incuriosiscono animali, piante e il pianeta","Medicine & Health":"Medicina e salute","Senior clinician":"Medico senior","Head of department":"Primario/a","Chief medical officer":"Direttore/trice sanitario/a","Medicine":"Medicina","Pediatrician":"Pediatra","Family physician":"Medico di famiglia","Surgeon":"Chirurgo/a","Dentistry":"Odontoiatria","Dental hygienist":"Igienista dentale","General dentist":"Dentista generico/a","Orthodontist":"Ortodontista","Nursing":"Infermieristica","Licensed practical nurse":"Operatore/trice sociosanitario/a","Registered nurse":"Infermiere/a","Nurse practitioner or anesthetist":"I alto. Se perdi, vieni messo da parte.","Stay the tech expert":"Resta esperto/a tecnico/a","A mega-project abroad":"Un megaprogetto all'estero","A huge project in another country needs engineers. It could boost your whole career. Or the project could be cancelled after a year.":"Un progetto enorme in un altro paese cerca ingegneri. Potrebbe lanciare tutta la tua carriera. Oppure il progetto potrebbe essere cancellato in un anno.","Join the project":"Entra nel progetto","Stay on local projects":"Resta sui progetti locali","Start your own firm":"Avvia la tua società di ingegneria","You have contacts and some savings. Most new firms fail. The ones that win contracts pay far more than a salary.":"Hai contatti e qualche risparmio. La maggior parte delle nuove società fallisce. Quelle che vincono contratti rendono molto più di uno stipendio.","Start the firm":"Avvia la società","Lead the whole division":"Dirigi l'intera divisione","The chief engineer is retiring. Going for the job means long hours and office battles. Win and you climb high. Lose and you are pushed aside.":"L'ingegnere capo va in pensione. Candidarsi significa tante ore e politica d'ufficio. Se vinci, sali in alto. Se perdi, vieni messo da parte.","Stay the expert":"Resta specialista","A post at head office abroad":"Un ruolo in sede, all'estero","Head office in another country wants you. It could boost your whole career. Or the post could be cut after a year.":"La sede, in un altro paese, ti vuole. Potrebbe lanciare tutta la tua carriera. Oppure il ruolo potrebbe essere tagliato in un anno.","Take the post":"Accetta il ruolo","Stay where I am":"Resta dove sono","Start your own company":"Avvia la tua azienda","You have an idea and some savings. Most new businesses fail. The ones that work pay far more than a salary.":"Hai un'idea e qualche risparmio. La maggior parte delle nuove imprese fallisce. Quelle che funzionano rendono molto più di uno stipendio.","Start the company":"Avvia l'azienda","Go for the executive seat":"Punta alla poltrona da dirigente","A top job is opening. Going for it means long hours and office battles. Win and you climb high. Lose and you are pushed aside.":"Si libera un ruolo alto. Candidarsi significa tante ore e politica d'ufficio. Se vinci, sali in alto. Se perdi, vieni messo da parte.","Stay the specialist":"Resta specialista","An international firm calls":"Chiama uno studio internazionale","A big law firm in another country wants you. It could make your career. Or you could be let go after a year.":"Un grande studio legale di un altro paese ti vuole. Potrebbe fare la tua carriera. Oppure potresti essere lasciato a casa dopo un anno.","Join the firm":"Entra nello studio","Open your own law office":"Apri il tuo studio legale","You have a few loyal clients and some savings. Many new offices struggle. The ones that work pay far more than a salary.":"Hai alcuni clienti fedeli e qualche risparmio. Molti nuovi studi faticano. Quelli che funzionano rendono molto più di uno stipendio.","Open the office":"Apri lo studio","Go for the top seat":"Punta al ruolo più alto","An international school abroad":"Una scuola internazionale all'estero","An international school in another country offers you a post. It pays well and could boost your career. Or the contract could end after a year.":"Una scuola internazionale di un altro paese ti offre un posto. Paga bene e potrebbe lanciare la tua carriera. Oppure il contratto potrebbe finire dopo un anno.","Stay at my school":"Resta nella mia scuola","Open a learning centre":"Apri un centro di ripetizioni","You have an idea for a tutoring centre and some savings. Most new centres fail. The ones that fill up pay far more than a salary.":"Hai un'idea per un doposcuola e qualche risparmio. La maggior parte dei nuovi centri fallisce. Quelli che si riempiono rendono molto più di uno stipendio.","Open the centre":"Apri il centro","Go for the top education job":"Punta al ruolo più alto dell'istruzione","A top job is opening. Going for it means politics and paperwork. Win and you climb high. Lose and you are pushed aside.":"Si libera un ruolo alto. Candidarsi significa politica e scartoffie. Se vinci, sali in alto. Se perdi, vieni messo da parte.","Stay with my students":"Resta con i miei studenti","A famous studio abroad":"Uno studio famoso all'estero","A well-known studio in another country wants you. It could make your name. Or you could be let go after one project.":"Uno studio noto di un altro paese ti vuole. Potrebbe farti un nome. Oppure potresti essere lasciato a casa dopo un solo progetto.","Join the studio":"Entra nello studio","Open your own studio":"Apri il tuo studio","You have a few clients and some savings. Most new studios fail. The ones that win big clients pay far more than a salary.":"Hai alcuni clienti e qualche risparmio. La maggior parte dei nuovi studi fallisce. Quelli che conquistano grandi clienti rendono molto più di uno stipendio.","Open the studio":"Apri lo studio","Go for creative director":"Punta alla direzione creativa","The top creative job is opening. Going for it means less design and more office battles. Win and you climb high. Lose and you are pushed aside.":"Si libera il ruolo creativo più alto. Candidarsi significa meno progettazione e più politica d'ufficio. Se vinci, sali in alto. Se perdi, vieni messo da parte.","Stay the designer":"Continua a progettare","A research post abroad":"Un posto di ricerca all'estero","A top lab in another country offers you a post. It could make your name. Or the grant could run out after a year.":"Un laboratorio di punta di un altro paese ti offre un posto. Potrebbe farti un nome. Oppure la borsa potrebbe finire dopo un anno.","Stay in my lab":"Resta nel mio laboratorio","Turn your research into a company":"Trasforma la tua ricerca in un'azienda","Your discovery could become a product. Most science startups fail. The ones that work pay far more than a salary.":"La tua scoperta potrebbe diventare un prodotto. La maggior parte delle startup scientifiche fallisce. Quelle che funzionano rendono molto più di uno stipendio.","Lead the institute":"Dirigi l'istituto","The director is leaving. Going for the job means budgets and politics instead of experiments. Win and you climb high. Lose and you are pushed aside.":"Il direttore se ne va. Candidarsi significa budget e politica al posto degli esperimenti. Se vinci, sali in alto. Se perdi, vieni messo da parte.","Stay in research":"Resta nella ricerca","A hospital job abroad":"Un lavoro in ospedale all'estero","A hospital in another country is hiring. The pay is higher and it could boost your career. Or the contract could end after a year.":"Un ospedale di un altro paese assume. Lo stipendio è più alto e potrebbe lanciare la tua carriera. Oppure il contratto potrebbe finire dopo un anno.","Take the job":"Accetta il lavoro","Open your own practice":"Apri la tua attività sanitaria","A pharmacy or clinic of your own. Many struggle in the first years. The ones that work pay far more than a salary.":"Una farmacia o uno studio tutto tuo. Molti faticano nei primi anni. Quelli che funzionano rendono molto più di uno stipendio.","Open it":"Aprila","Go for director of services":"Punta alla direzione dei servizi","A field project abroad":"Un progetto sul campo all'estero","A big project in another country needs your skills. It could boost your whole career. Or the funding could stop after a year.":"Un grande progetto in un altro paese ha bisogno delle tue competenze. Potrebbe lanciare tutta la tua carriera. Oppure i fondi potrebbero fermarsi dopo un anno.","Start a green business":"Avvia un'impresa verde","You have an idea and some savings: a farm, a lab or a consultancy. Most new businesses fail. The ones that work pay far more than a salary.":"Hai un'idea e qualche risparmio: una fattoria, un laboratorio o una società di consulenza. La maggior parte delle nuove imprese fallisce. Quelle che funzionano rendono molto più di uno stipendio.","Start the business":"Avvia l'impresa","Lead the programme":"Dirigi il programma","Stay in the field":"Resta sul campo","A research grant abroad":"Una borsa di ricerca all'estero","A university in another country offers you a place on a big study. It could make your name. Or the grant could end after a year.":"Un'università di un altro paese ti offre un posto in un grande studio. Potrebbe farti un nome. Oppure la borsa potrebbe finire dopo un anno.","Take the grant":"Accetta la borsa","Start your own consultancy":"Avvia la tua società di consulenza","Companies and governments pay for expert advice. Most new consultancies fail. The ones that work pay far more than a salary.":"Aziende e governi pagano per i consigli degli esperti. La maggior parte delle nuove società di consulenza fallisce. Quelle che funzionano rendono molto più di uno stipendio.","Start the consultancy":"Avvia la società","A big media house abroad":"Una grande testata all'estero","A famous media company in another country wants you. It could make your name. Or your post could be cut after a year.":"Una famosa azienda di media di un altro paese ti vuole. Potrebbe farti un nome. Oppure il tuo ruolo potrebbe essere tagliato in un anno.","Go independent":"Mettiti in proprio","Your own channel, studio or publishing house. Most never find an audience. The ones that do pay far more than a salary.":"Il tuo canale, il tuo studio o la tua casa editrice. La maggior parte non trova mai un pubblico. Quelli che lo trovano guadagnano molto più di uno stipendio.","Go for the top media job":"Punta al ruolo più alto dei media","Stay the storyteller":"Continua a raccontare storie","Another doctor":"Un altro medico","In US census data, doctors most often marry other doctors. Nearly 1 in 5 does.":"Nei dati del censimento USA, i medici sposano soprattutto altri medici. Quasi 1 su 5.","Another dentist":"Un/a altro/a dentista","In US data, dentists are among the jobs most likely to marry inside their own profession.":"Nei dati USA, i dentisti sono tra i mestieri che più spesso si sposano tra loro.","A driver":"Un/a autista","A surprise from US census data: the most common match for nurses is a driver.":"Una sorpresa dei dati del censimento USA: il partner più comune di chi fa l'infermiere guida un veicolo per lavoro.","Another software developer":"Un/a altro/a sviluppatore/trice","In US census data, software developers most often marry other software developers.":"Nei dati del censimento USA, gli sviluppatori sposano soprattutto altri sviluppatori.","Another teacher":"Un/a altro/a insegnante","In US census data, teachers most often marry other teachers.":"Nei dati del censimento USA, gli insegnanti sposano soprattutto altri insegnanti.","A school teacher":"Un/a insegnante","In US census data, the most common match for this kind of job is a school teacher. Teachers are the top match for more jobs than anyone else.":"Nei dati del censimento USA, il partner più comune per questo tipo di lavoro insegna a scuola. Gli insegnanti sono il partner più comune per più mestieri di qualsiasi altro.","There is no exact number for this job. School teachers are the most common match for most professions in US census data, so the game uses that.":"Non c'è un numero esatto per questo lavoro. Gli insegnanti sono il partner più comune per la maggior parte dei mestieri nel censimento USA, quindi il gioco usa quello.","A manager":"Un/a manager","In US census data, marketing and finance managers most often marry other managers.":"Nei dati del censimento USA, i manager di marketing e finanza sposano soprattutto altri manager.","Another lawyer":"Un/a altro/a avvocato/a","In US census data, lawyers most often marry other lawyers.":"Nei dati del censimento USA, gli avvocati sposano soprattutto altri avvocati.","Another scientist":"Un/a altro/a scienziato/a","In US census data, physical scientists most often marry other scientists.":"Nei dati del censimento USA, gli scienziati delle scienze fisiche sposano soprattutto altri scienziati.","Another pharmacist":"Un/a altro/a farmacista","In US census data, pharmacists most often marry other pharmacists.":"Nei dati del censimento USA, i farmacisti sposano soprattutto altri farmacisti.","No car. You take the bus, the metro or a bike":"Niente auto. Usi autobus, metro o bici","A scooter or small motorbike":"Uno scooter o una piccola moto","An old, used small car (like a Suzuki Swift)":"Una vecchia utilitaria usata (come una Suzuki Swift)","A new small car (like a Kia Picanto)":"Un'utilitaria nuova (come una Kia Picanto)","A new family car (like a Toyota Corolla)":"Un'auto familiare nuova (come una Toyota Corolla)","A bigger car or SUV (like a Toyota Camry)":"Un'auto più grande o un SUV (come una Toyota Camry)","A premium car (like a BMW 3 Series)":"Un'auto premium (come una BMW Serie 3)","A big luxury car (like a Mercedes E-Class)":"Una grande auto di lusso (come una Mercedes Classe E)","A sports car (like a Porsche 911)":"Un'auto sportiva (come una Porsche 911)","A supercar (like a Ferrari)":"Una supercar (come una Ferrari)","A big villa that you pay off early":"Una grande villa che finisci di pagare presto","A family house in a good area":"Una casa di famiglia in un bel quartiere","Your own comfortable flat, paid off with a home loan":"Un tuo appartamento comodo, pagato con un mutuo","Your own small flat, with a long home loan":"Un tuo piccolo appartamento, con un mutuo lungo","A rented flat. Buying is too expensive for now":"Un appartamento in affitto. Comprare per ora costa troppo","A shared flat or your family home. Rent takes most of your pay":"Un appartamento condiviso o la casa di famiglia. L'affitto si prende quasi tutto lo stipendio","on a small income":"a basso reddito","on a steady income":"a reddito stabile","on a good income":"con un buon reddito","on a high income":"ad alto reddito","on a very high income":"a reddito molto alto","Against the Odds":"Contro ogni pronostico","The Late Bloomer":"Successo tardivo","The Gambler Who Won":"La scommessa vinta","Burned by the Dice":"Bruciato/a dal dado","Played Safe, Finished Strong":"Sul sicuro, ma forte","The Safe Pair of Hands":"Costante e sicuro/a","Born Lucky, Played It Well":"Nato/a bene, giocato bene","The Climber":"In piena ascesa","The Dice Were Unkind":"Il dado non ha aiutato","The Steady Professional":"Professionista costante","More than 1 in 5 doctors is married to another doctor.":"Più di 1 medico su 5 è sposato con un altro medico.","About 12 in 100 working couples share the same broad field.":"Circa 12 coppie che lavorano su 100 condividono lo stesso grande settore.","About 8 in 100 people in finance are married to someone in finance.":"Circa 8 persone su 100 che lavorano nella finanza sono sposate con qualcuno della finanza.","Nearly 15 in 100 people in legal jobs are married to someone in a legal job.":"Quasi 15 persone su 100 nei lavori legali sono sposate con qualcuno di un lavoro legale.","Teachers often marry teachers. In more than 1 in 3 couples where the husband works in education, the wife does too.":"Gli insegnanti si sposano spesso tra loro. In più di 1 coppia su 3 in cui il marito lavora nell'istruzione, lavora lì anche la moglie.","Nearly 11 in 100 people in science jobs are married to someone in science.":"Quasi 11 persone su 100 nei lavori scientifici sono sposate con qualcuno della scienza."},"text":{"brand":"Three Roads","other":"العربية","lookDay":"Modalità giorno","lookNight":"Modalità notte","steps":["Nascita","Facoltà","Indirizzo","Primo lavoro","Scelte","Pensione"],"ord":["1ª","2ª","3ª"],"tier":["Basso","Medio","Alto"],"tierJob":["Lavoro a stipendio basso","Lavoro a stipendio medio","Lavoro a stipendio alto"],"diff":{"a":"Settore difficile","b":"Settore medio","c":"Settore sicuro"},"diffTip":{"a":"Settore difficile: paga di più, ma meno persone ottengono il lavoro a stipendio alto.","b":"Settore medio: una probabilità normale per ogni lavoro.","c":"Settore sicuro: la maggior parte ottiene il lavoro a stipe ade per continuare.","livesH":"Sei in pensione! Le tue tre vite ({c})","scoreK":"Punteggio di vita","outOf":"su 100","pctLine":"Hai fatto meglio di {p} giocatori su 100 nati nel tuo paese ({c}).","cardLife":"{job}; in pensione come {rank}","cardPay":"{pay} all'anno al massimo","shotHint":"Oppure fai uno screenshot della scheda e pubblicalo.","shareBtn":"Copia il mio risultato","copied":"Copiato. Ora incollalo e invialo.","copyFail":"Seleziona questo testo e copialo:","shareText":"Three Roads: paese di nascita {c}, talento per {t}. La mia vita migliore: {job}; in pensione come {rank} con {pay} all'anno. Punteggio di vita {s} su 100, meglio di {p} giocatori su 100 dello stesso paese ({c}). Il mio titolo: {title}. {roast}","and":"e","kJob":"Primo lavoro","kSalary":"Il tuo stipendio a 45 anni","capAt45":"dopo le tue tre scelte","capAt65":"come {r}, il tuo stipendio più alto","kChoices":"Le tue scelte","kCar":"Auto","kHome":"Casa","kRank":"Fin dove sei salito/a","kSpouse":"Chi sposi più probabilmente","kPeak":"Il tuo stipendio a 65 anni","kScore":"Punteggio di vita","jobNote":"Il dado ha fatto {u}. Era la tua {o} scelta.","salNote":"Hai iniziato con {b}. Le tue scelte l'hanno cambiato di {m}.","budget":"Puoi spendere circa {x} per un'auto. È il 40% di un anno di stipendio.","homeNote":"Una casa normale costa circa {y} anni del tuo stipendio.","rankNote":"Il dado ha fatto {u}. Le tue probabilità erano {o}.","spouseNote":"Anche negli Stati Uniti, {p} persone laureate su 100 che hanno un partner stanno con un'altra persona laureata. {m} Il livello di reddito è una stima del gioco.","peakNote":"È il tuo stipendio a 45 anni più l'aumento che arriva con il tuo ruolo.","scoreNote":"Punti: {a} per lo stipendio + {b} per il ruolo + {c} per la casa. Hai lavorato {y} anni.","weightAria":"Forma del corpo più probabile: {s}, {p}%","weightTip":"La forma del corpo più probabile per questo tipo di lavoro nel tuo paese ({c}). Magro {a}%, in forma {b}%, obeso {d}%. È una stima: i dati del rom what it pays in the United States (<a href=\"https://www.bls.gov/ooh/\">US Bureau of Labor Statistics</a>, May 2025). The game then scales it to your country using average pay.","<strong>Adjusted in 10 richer countries.</strong> There the game also uses OECD numbers on how much graduates, doctors and nurses earn (<a href=\"https://www.oecd.org/en/publications/education-at-a-glance-2026_b4968bbc-en/full-report/what-are-the-earnings-advantages-to-education_61f6b960\">Education at a Glance 2026</a>; Health at a Glance 2025 for <a href=\"https://www.oecd.org/en/publications/health-at-a-glance-2025_8f9e3f98-en/full-report/remuneration-of-specialists_a50d2aa8.html\">doctors</a> and <a href=\"https://www.oecd.org/en/publications/health-at-a-glance-2025_8f9e3f98-en/full-report/remuneration-of-nurses_9b98c70c.html\">nurses</a>). Teachers’ pay is not adjusted.","<strong>A rough guess in 7 countries.</strong> For Saudi Arabia, China, South Africa, Brazil, India, Indonesia and Egypt there were no such numbers. The game assumes jobs compare with each other the way they do in the US. Real graduates there often earn more than the game shows.","<strong>Top pay.</strong> The game shows what the best-paid 1 in 10 people in a job earn. It counts that as 1.6 times the middle salary, based on six US jobs that were checked.","<strong>Real, US only: who marries whom.</strong> The most likely partner comes from a <a href=\"https://www.zippia.com/advice/?p=22379\">Zippia study of US census data</a> on the most common job of each job’s spouse. Where a job has no number of its own, the game uses the most common match overall, a school teacher. The other numbers are from <a href=\"https://www.pewresearch.org/short-reads/2022/09/07/college-grads-in-u-s-tend-to-partner-with-each-other-especially-if-their-parents-also-graduated-from-college/\">Pew Research Center</a> (2019) and a <a href=\"https://priceonomics.com/?p=7632\">Priceonomics study of 2012 US survey data</a>.","<strong>Real numbers, rough estimate: the body figure.</strong> Each country starts from the share of its adults at each weight level (World Health Organization estimates for 2022, as shown in <a href=\"https://lumistats.com/rankings/obesity/\">World Bank data</a> and a <a href=\"https://brilliantmaps.com/?p=5888\">summary of WHO data</a>). The game then moves it by how job groups differ in a <a href=\"https://pmc.ncbi.nlm.nih.gov/articles/PMC5508147/table/tbl1\">US survey of workers</a> (2013–2014). Numbers by job exist for only a few countries, so outside the US this is a guess. The three figures stand for a body-mass index under 25, from 25 to 30, and 30 or more.","<strong>Real in 8 countries: the chance when you start a business.</strong> It is the share of new businesses still open after five years, from official statistics: <a href=\"https://ised-isde.canada.ca/site/sme-research-statistics/en/key-small-business-statistics/key-small-business-statistics-2025\">Canada</a>, the <a href=\"https://startbusinessbystate.com/business-survival-rates-by-state/\">United States</a>, <a href=\"https://agenciadenoticias.ibge.gov.br/media/com_mediaibge/arquivos/31b1e5b8c4e3f229b26bd0bc1a5a8e87.pdf\">Brazil</a>, the <a href=\"https://cy.ons.gov.uk/businessindustryandtrade/business/activitysizeandlocation/bulletins/businessdemography/2024/pdf\">United Kingdom</a> and <a href=\"https://en.nocutnews.co.kr/news/6595342\">South Korea</a>. Germany and France use the <a href=\"https://ec.europa.eu/eurostat/cache/htmlpub/key-figures-on-european-business-2022/business_dynamics.html\">European Union average</a>, and Mexico a <a href=\"https://www.researchgate.net/figure/Business-survival-in-OECD-countries_tbl1_361546053\">second-hand figure</a>. The other 10 countries use the <a href=\"https://www.oecd.org/en/publications/cross-country-evidence-on-start-up-dynamics_5jrxtkb9mxtb-en.html\">OECD figure of about half</a>. Countries count businesses in different ways, so part of the gap between them is not real.","<strong>People to look up to.</strong> Three well-known people for each focus, from around the world, with at least one woman in each. They are examples, not a ranking of who is best.","<strong>Made up for the game.</strong> Talents, how hard each field is, the job chances, the chances for working abroad and for the top job, the stories of the life choices and what you win or lose, the car and home rules, the ranks, who you marry, the one-line verdict and the life score. “Better than N out of 100” compares you with 2,000 computer players who choose at random.","<strong>This is a game, not career or health advice.</strong> Real life depends on much more than dice."]}},"pcm":{"d":{"Maths and logic come easily to you":"Maths and logic dey easy for you","You write and argue well":"You sabi write and argue well","You read people and lead them":"You sabi understand people and lead dem","You are patient with people who need help":"You get patience with people wey need help","You build and design things well":"You sabi build and design things well","You are curious about animals, plants and the planet":"Animals, plants and di planet dey interest you","A fellowship abroad":"Residency for abroad","A famous hospital in another country offers you a training post. It could make your name. Or the funding could end after a year.":"One famous hospital for another country offer you training place. E fit make your name. Or di money fit finish after one year.","Take the fellowship":"Take di place","Stay at my hospital":"Stay for my hospital","You have savings and patients who trust you. Many private clinics struggle. The ones that work pay far more than a salary.":"You get savings and patients wey trust you. Plenty private clinics dey struggle. Di ones wey work dey pay far pass salary.","Open the clinic":"Open di clinic","Stay on staff":"Remain staff","Lead the hospital":"Run di hospital","The top medical job is opening. Going for it means meetings, budgets and rivals. Win and you fessional":"Steady professional","More than 1 in 5 doctors is married to another doctor.":"More than 1 out of 5 doctors marry another doctor.","About 12 in 100 working couples share the same broad field.":"About 12 out of every 100 working couples dey di same big field.","About 8 in 100 people in finance are married to someone in finance.":"About 8 out of every 100 people wey dey work for finance marry person for finance.","Nearly 15 in 100 people in legal jobs are married to someone in a legal job.":"Almost 15 out of every 100 people for legal jobs marry person for legal job.","Teachers often marry teachers. In more than 1 in 3 couples where the husband works in education, the wife does too.":"Teachers dey marry each other well well. For more than 1 out of 3 couples where di husband dey work for education, di wife dey work there too.","Nearly 11 in 100 people in science jobs are married to someone in science.":"Almost 11 out of every 100 people for science jobs marry person for science."},"text":{"brand":"Three Roads","other":"العربية","lookDay":"Day look","lookNight":"Night look","steps":["Born","Courses","Focus","First job","Choices","Retire"],"ord":["1st","2nd","3rd"],"tier":["Low","Middle","High"],"tierJob":["Low pay job","Middle pay job","High pay job"],"diff":{"a":"Hard field","b":"Medium field","c":"Safe field"},"diffTip":{"a":"Hard field: e dey pay pass, but na few people dey get di high pay job.","b":"Medium field: normal chance for each job.","c":"Safe field: most people dey get di middle pay job."},"more":"More info","shapes":["slim","fit","obese"],"lede":"You no fit choose where dem born you. But you fit choose wetin you go study and when you go take risk.","howGoes":"How to play","rules":["<strong>Born.</strong> Di wheel go give you one country. Rich countries dey pay pass. After dat, you go pick two talents.","<strong>Three courses.</strong> Course na wetin you go study for university. Pick three. Each one go turn to one road.","<strong>First job.</strong> One spin go give each road low, middle or high pay job.","<strong>Three choices.</strong> When you reach 28, 36 and 45, you go decide for each road: take risk or play am safe. You go always see your chance first.","<strong>Retire.</strong> When you reach 65, each life go get score from 0 to 100. Na di best one dem go count."],"wheelLabel":"Born wheel wey get {n} countries","wheelTip":"Di wheel get {n} countries. All of dem get di same chance. Rich countries dey pay pass.","yourBirthplace":"Where dem born you","notDrawn":"?","spin":"Spin di wheel","skipHint":"Tap anywhere to skip","bornIn":"Dem born you for <strong>{c}</strong>","avgWage":"Average salary","aYear":"per year","talentsK":"Talents","talentK":"Talent","vsUS":"Dat one na {p}% of di average salary for United States.","usBench":"Na dis one dem dey use compare all di other countries for di game.","talentsPick":"Pick two talents","helpsN":"e dey help for {n} courses","talentTip":"{d}. E dey help for: {m}.","talentsTip":"Talent dey raise your chance to get di high pay job (+{b}) for courses wey dey use am. E still dey help small when you take risk. Courses wey match your talents go show first for di next screen.","cardMate":"Who you fit marry pass: {m}","toMajors":"Pick my three courses","rerollBirth":"Spin another born","codeK":"Challenge code","copyCode":"Copy code","codeCopied":"Code don copy.","codeNote":"Give person dis code. Di person go start with di same country and di same talents like you. Then una go see who go score pass.","challengeOn":"You dey play with another person start: same country, same talents.","haveCode":"You get challenge code?","useCode":"Play with dis code","badCode":"Dat code no work. Code dey look like dis: BR-NUM-CAR.","shareCode":" Try beat me from di same start. Code: {code}.","lanesLabel":"Di three roads by age","step":"Step {i} of 6","majorsH":"Pick your three courses","majorsTip":"Course na wetin you go study for university. Tap three, start with di one you like pass. Di eTitle":"Same job, another country","elseH":"Best salary for your best first job ({job}) for each of di {n} countries, in US dollars per year","restart":"Spin new life","again":"Stay for {c} and pick again","srcH":"Where di numbers come from","srcLead":"Dis na game. Di salaries come from real statistics. Di dice, di choices and di scores, na we make dem up.","src":["<strong>Real: average pay in each country.</strong> From the OECD, a group of countries that collects statistics (<a href=\"https://www.oecd-ilibrary.org/en/publications/pensions-at-a-glance-2025_e40274c1-en/full-report/average-wage_da2c17cc\">Pensions at a Glance 2025</a>, numbers for 2024). Egypt’s number comes from its statistics agency, as reported by <a href=\"https://wage.is/egypt/\">wage.is</a>.","<strong>Real: what jobs pay.</strong> Each of the 108 jobs starts from what it pays in the United States (<a href=\"https://www.bls.gov/ooh/\">US Bureau of Labor Statistics</a>, May 2025). The game then scales it to your country using average pay.","<strong>Adjusted in 10 richer countries.</strong> There the game also uses OECD numbers on how much graduates, doctors and nurses earn (<a href=\"https://www.oecd.org/en/publications/education-at-a-glance-2026_b4968bbc-en/full-report/what-are-the-earnings-advantages-to-education_61f6b960\">Education at a Glance 2026</a>; Health at a Glance 2025 for <a href=\"https://www.oecd.org/en/publications/health-at-a-glance-2025_8f9e3f98-en/full-report/remuneration-of-specialists_a50d2aa8.html\">doctors</a> and <a href=\"https://www.oecd.org/en/publications/health-at-a-glance-2025_8f9e3f98-en/full-report/remuneration-of-nurses_9b98c70c.html\">nurses</a>). Teachers’ pay is not adjusted.","<strong>A rough guess in 7 countries.</strong> For Saudi Arabia, China, South Africa, Brazil, India, Indonesia and Egypt there were no such numbers. The game assumes jobs compare with each other the way they do in the US. Real graduates there often earn more than the game shows.","<strong>Top pay.</strong> The game shows what the best-paid 1 in 10 people in a job earn. It counts that as 1.6 times the middle salary, based on six US jobs that were checked.","<strong>Real, US only: who marries whom.</strong> The most likely partner comes from a <a href=\"https://www.zippia.com/advice/?p=22379\">Zippia study of US census data</a> on the most common job of each job’s spouse. Where a job has no number of its own, the game uses the most common match overall, a school teacher. The other numbers are from <a href=\"https://www.pewresearch.org/short-reads/2022/09/07/college-grads-in-u-s-tend-to-partner-with-each-other-especially-if-their-parents-also-graduated-from-college/\">Pew Research Center</a> (2019) and a <a href=\"https://priceonomics.com/?p=7632\">Priceonomics study of 2012 US survey data</a>.","<strong>Real numbers, rough estimate: the body figure.</strong> Each country starts from the share of its adults at each weight level (World Health Organization estimates for 2022, as shown in <a href=\"https://lumistats.com/rankings/obesity/\">World Bank data</a> and a <a href=\"https://brilliantmaps.com/?p=5888\">summary of WHO data</a>). The game then moves it by how job groups differ in a <a href=\"https://pmc.ncbi.nlm.nih.gov/articles/PMC5508147/table/tbl1\">US survey of workers</a> (2013–2014). Numbers by job exist for only a few countries, so outside the US this is a guess. The three figures stand for a body-mass index under 25, from 25 to 30, and 30 or more.","<strong>Real in 8 countries: the chance when you start a business.</strong> It is the share of new businesses still open after five years, from official statistics: <a href=\"https://ised-isde.canada.ca/site/sme-research-statistics/en/key-small-business-statistics/key-small-business-statistics-2025\">Canada</a>, the <a href=\"https://startbusinessbystate.com/business-survival-rates-by-state/\">United States</a>, <a href=\"https://agenciadenoticias.ibge.gov.br/media/com_mediaibge/arquivos/31b1e5b8c4e3f229b26bd0bc1a5a8e87.pdf\">Brazil</a>, the <a href=\"https://cy.ons.gov.uk/businessindustryandtrade/business/activitysizeandlocation/bulletins/businessdemography/2024/pdf\">United Kingdom</a> and <a href=\"https://en.nocutnews.co.kr/news/6595342\">South Korea</a>. Germany and France use the <a href=\"https://ec.europa.eu/eurostat/cache/htmlpub/key-figures-on-european-business-2022/business_dynamics.html\">European Union average</a>, and Mexico a <a href=\"https://www.researchgate.net/figure/Business-survival-in-OECD-countries_tbl1_361546053\">second-hand figure</a>. The other 10 countries use the <a href=\"https://www.oecd.org/en/publications/cross-country-evidence-on-start-up-dynamics_5jrxtkb9mxtb-en.html\">OECD figure of about half</a>. Countries count businesses in different ways, so part of the gap between them is not real.","<strong>People to look up to.</strong> Three well-known people for each focus, from around the world, with at least one woman in each. They are examples, not a ranking of who is best.","<strong>Made up for the game.</strong> Talents, how hard each field is, the job chances, the chances for working abroad and for the top job, the stories of the life choices and what you win or lose, the car and home rules, the ranks, who you marry, the one-line verdict and the life score. “Better than N out of 100” compares you with 2,000 computer players who choose at random.","<strong>This is a game, not career or health advice.</strong> Real life depends on much more than dice."]}}};
